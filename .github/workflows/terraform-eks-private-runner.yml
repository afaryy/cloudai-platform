name: terraform-eks-private-runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "VPC-connected CodeBuild runner lifecycle operation"
        required: true
        default: "source-validate"
        type: choice
        options:
          - source-validate
          - plan
          - apply
          - runtime-validate
      confirmation:
        description: "Exact confirmation required for apply"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-eks-private-runner
  cancel-in-progress: false

env:
  TERRAFORM_DIR: providers/aws/infra/terraform/envs/eks-private-runner
  TF_STATE_KEY_SUFFIX: eks-private-runner/terraform.tfstate

jobs:
  source_validation:
    name: Private runner source validation
    if: ${{ inputs.mode == 'source-validate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-private-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate runner source without AWS credentials
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
          terraform test

  protected_runner:
    name: Protected VPC-connected runner lifecycle
    if: ${{ inputs.mode != 'source-validate' }}
    runs-on: ubuntu-latest
    environment: aws-private-eks
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-private-runner
    env:
      AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME: ${{ vars.AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME || secrets.AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/eks-private-runner/terraform.tfstate
      TF_VAR_network_state_bucket: ${{ vars.TF_BACKEND_BUCKET }}
      TF_VAR_network_state_key: ${{ vars.TF_STATE_KEY_PREFIX }}/eks-private-network/terraform.tfstate
      TF_VAR_network_state_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_runner_project_name: ${{ vars.PRIVATE_EKS_RUNNER_PROJECT_NAME }}
      TF_VAR_github_repository_url: ${{ vars.PRIVATE_EKS_RUNNER_GITHUB_REPOSITORY_URL }}
      TF_VAR_github_source_auth_type: ${{ vars.PRIVATE_EKS_RUNNER_SOURCE_AUTH_TYPE || 'NONE' }}
      TF_VAR_github_source_auth_resource: ${{ vars.PRIVATE_EKS_RUNNER_SOURCE_AUTH_RESOURCE }}
      TF_VAR_private_ecr_repository_arns: ${{ vars.PRIVATE_EKS_PRIVATE_ECR_REPOSITORY_ARNS_JSON }}
      TF_VAR_artifact_bucket_arns: ${{ vars.PRIVATE_EKS_ARTIFACT_BUCKET_ARNS_JSON }}
      PRIVATE_EKS_RUNNER_APPLY_READY: ${{ vars.PRIVATE_EKS_RUNNER_APPLY_READY }}
      PRIVATE_EKS_RUNNER_BUDGET_APPROVED: ${{ vars.PRIVATE_EKS_RUNNER_BUDGET_APPROVED }}
      PRIVATE_EKS_RUNNER_MONTHLY_BUDGET_USD: ${{ vars.PRIVATE_EKS_RUNNER_MONTHLY_BUDGET_USD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain runner bootstrap boundary
        run: |
          echo "This GitHub-hosted job creates or inspects only the separate VPC-connected CodeBuild runner state."
          echo "It consumes the reviewed private-network remote state and does not create VPC, EKS, ARC, GPU, Kueue, HyperPod, or Slurm resources."
          echo "The runner Terraform OIDC role is distinct from the network role and the CodeBuild runtime service role."
          echo "No Terraform state, account ID, role ARN, subnet ID, security-group ID, or runner credential is published."

      - name: Check protected runner inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_STATE_KEY TF_VAR_network_state_bucket TF_VAR_network_state_key TF_VAR_network_state_region TF_VAR_runner_project_name TF_VAR_github_repository_url TF_VAR_private_ecr_repository_arns TF_VAR_artifact_bucket_arns PRIVATE_EKS_RUNNER_BUDGET_APPROVED PRIVATE_EKS_RUNNER_MONTHLY_BUDGET_USD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-private-eks environment."
              missing=1
            fi
          done
          if [ "$PRIVATE_EKS_RUNNER_BUDGET_APPROVED" != "true" ]; then
            echo "::error::PRIVATE_EKS_RUNNER_BUDGET_APPROVED must be exactly true."
            missing=1
          fi
          if ! awk 'BEGIN { exit !(ARGV[1] > 0) }' "$PRIVATE_EKS_RUNNER_MONTHLY_BUDGET_USD"; then
            echo "::error::PRIVATE_EKS_RUNNER_MONTHLY_BUDGET_USD must be a positive number."
            missing=1
          fi
          if [ "$TF_VAR_network_state_key" != "${TF_STATE_KEY_PREFIX}/eks-private-network/terraform.tfstate" ]; then
            echo "::error::The runner must consume the single reviewed private-network state key."
            missing=1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and startswith("arn:aws:ecr:") and (contains("*") | not))' <<<"$TF_VAR_private_ecr_repository_arns" >/dev/null; then
            echo "::error::PRIVATE_EKS_PRIVATE_ECR_REPOSITORY_ARNS_JSON must contain explicit ECR repository ARNs."
            missing=1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and startswith("arn:aws:s3:::") and (contains("*") | not))' <<<"$TF_VAR_artifact_bucket_arns" >/dev/null; then
            echo "::error::PRIVATE_EKS_ARTIFACT_BUCKET_ARNS_JSON must contain explicit S3 bucket ARNs."
            missing=1
          fi
          if [ "$MODE" = "apply" ]; then
            if [ "$PRIVATE_EKS_RUNNER_APPLY_READY" != "true" ]; then
              echo "::error::PRIVATE_EKS_RUNNER_APPLY_READY must be exactly true after plan review."
              missing=1
            fi
            if [ "$CONFIRMATION" != "I_UNDERSTAND_PRIVATE_EKS_RUNNER_APPLY" ]; then
              echo "::error::apply requires I_UNDERSTAND_PRIVATE_EKS_RUNNER_APPLY."
              missing=1
            fi
          fi
          exit "$missing"

      - name: Configure AWS credentials through dedicated runner OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with isolated runner backend
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform plan without saved artifact
        if: ${{ inputs.mode == 'plan' }}
        run: |
          terraform validate
          terraform plan -input=false -no-color > /tmp/private-runner-plan.log 2>&1
          printf '{"mode":"plan","terraform_plan_succeeded":true,"network_state_consumed":true,"raw_identifiers_published":false}\n' > /tmp/private-runner-plan-evidence.json

      - name: Fresh no-delete plan before apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          terraform plan -input=false -no-color -out=/tmp/private-runner-apply.tfplan > /tmp/private-runner-apply-plan.log 2>&1
          terraform show -json /tmp/private-runner-apply.tfplan > /tmp/private-runner-apply-plan.json
          if [ "$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' /tmp/private-runner-apply-plan.json)" -ne 0 ]; then
            echo "::error::Runner apply preflight found delete actions; refusing to continue."
            exit 1
          fi
          if jq -e '[.resource_changes[]? | select(.type | test("^aws_(vpc|subnet|route|route_table|vpc_endpoint|nat_gateway|eks_)") )] | length > 0' /tmp/private-runner-apply-plan.json >/dev/null; then
            echo "::error::Runner state must not own network or EKS resources."
            exit 1
          fi
          if ! jq -e '.planned_values.outputs.network_state_consumed.value == true' /tmp/private-runner-apply-plan.json >/dev/null; then
            echo "::error::Runner plan could not prove private-network state consumption."
            exit 1
          fi
          printf '{"mode":"apply","plan_preflight_succeeded":true,"delete_actions":0,"network_state_consumed":true,"duplicate_network_resources":false,"raw_identifiers_published":false}\n' > /tmp/private-runner-preflight-evidence.json

      - name: Apply runner foundation after fresh plan
        if: ${{ inputs.mode == 'apply' }}
        run: |
          terraform apply -input=false -auto-approve -no-color /tmp/private-runner-apply.tfplan > /tmp/private-runner-apply.log 2>&1
          printf '{"mode":"apply","terraform_apply_succeeded":true,"raw_identifiers_published":false}\n' > /tmp/private-runner-apply-evidence.json

      - name: Validate deployed CodeBuild runner metadata
        if: ${{ inputs.mode == 'runtime-validate' }}
        run: |
          set -euo pipefail
          runner_project_name=$(terraform output -raw runner_project_name)
          aws codebuild batch-get-projects --names "$runner_project_name" --region "$AWS_REGION" --output json > /tmp/private-runner-project.json
          jq -e '
            (.projects | length) == 1 and
            (.projects[0].vpcConfig.vpcId | type == "string" and length > 0) and
            (.projects[0].vpcConfig.subnets | type == "array" and length >= 2) and
            (.projects[0].vpcConfig.securityGroupIds | type == "array" and length >= 1) and
            (.projects[0].logsConfig.cloudWatchLogs.status == "ENABLED")
          ' /tmp/private-runner-project.json >/dev/null
          printf '{"runner_project_present":true,"vpc_attached":true,"private_subnets_configured":true,"logs_configured":true}\n' > /tmp/private-runner-runtime-evidence.json

      - name: Upload sanitised runner lifecycle evidence
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'runtime-validate' }}
        uses: actions/upload-artifact@v4
        with:
          name: eks-private-runner-lifecycle-evidence
          path: /tmp/private-runner-*-evidence.json
          if-no-files-found: error
          retention-days: 7
