name: terraform-validate

on:
  pull_request:
    paths:
      - "providers/aws/infra/terraform/**"
      - ".github/workflows/terraform-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Report placeholder state
        run: |
          echo "Terraform directories are placeholders in Sprint 00."
          find providers/aws/infra/terraform -maxdepth 4 -type d | sort
