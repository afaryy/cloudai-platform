name: terraform-eks-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform command mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - plan
          - apply
          - destroy
      confirm_apply:
        description: "For apply only, type I_UNDERSTAND_COST_AND_TEARDOWN"
        required: false
        default: ""
        type: string
      confirm_destroy:
        description: "For destroy only, type I_UNDERSTAND_DESTROY"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-eks-sandbox-control-plane
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform EKS sandbox readiness
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      EKS_CLUSTER_NAME: cloudai-platform-eks-sandbox
      TF_STACK_NAME: eks-sandbox
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/eks-sandbox/terraform.tfstate
      TF_VAR_endpoint_public_access_cidrs: ${{ vars.TF_VAR_ENDPOINT_PUBLIC_ACCESS_CIDRS || '["203.0.113.10/32"]' }}
      TF_VAR_node_desired_size: ${{ vars.TF_VAR_NODE_DESIRED_SIZE || '1' }}
      TF_VAR_node_min_size: ${{ vars.TF_VAR_NODE_MIN_SIZE || '1' }}
      TF_VAR_node_max_size: ${{ vars.TF_VAR_NODE_MAX_SIZE || '1' }}
      TF_VAR_github_actions_principal_arn: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      TF_VAR_local_operator_principal_arn: ${{ vars.LOCAL_OPERATOR_PRINCIPAL_ARN || secrets.LOCAL_OPERATOR_PRINCIPAL_ARN || '' }}
      TF_VAR_enable_eks_access_entries: "true"
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform validate
        if: ${{ inputs.mode == 'validate' }}
        run: terraform validate

      - name: Explain sandbox plan boundary
        if: ${{ inputs.mode == 'plan' }}
        run: |
          echo "Plan mode initializes the remote S3 backend from aws-sandbox environment variables."
          echo "It does not create a saved tfplan artifact and does not run apply or destroy."
          echo "Set TF_VAR_ENDPOINT_PUBLIC_ACCESS_CIDRS in aws-sandbox to an operator /32 before real apply."
          echo "Do not commit tfvars, tfstate, tfplan, kubeconfig, account IDs, ARNs, endpoints, or credentials."

      - name: Confirm sandbox apply gate
        if: ${{ inputs.mode == 'apply' }}
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          if [ "$CONFIRM_APPLY" != "I_UNDERSTAND_COST_AND_TEARDOWN" ]; then
            echo "::error::Apply requires confirm_apply=I_UNDERSTAND_COST_AND_TEARDOWN."
            echo "::error::Confirm budget alarm, same-day teardown intent, synthetic-only workload, and aws-sandbox environment approval before applying."
            exit 1
          fi
          echo "Apply confirmation accepted. Proceeding with backend initialization and Terraform apply."

      - name: Confirm sandbox destroy gate
        if: ${{ inputs.mode == 'destroy' }}
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "I_UNDERSTAND_DESTROY" ]; then
            echo "::error::Destroy requires confirm_destroy=I_UNDERSTAND_DESTROY."
            echo "::error::Confirm teardown owner, evidence capture, and aws-sandbox environment approval before destroying."
            exit 1
          fi
          echo "Destroy confirmation accepted. Proceeding with backend initialization and Terraform destroy."

      - name: Check backend environment variables
        if: ${{ inputs.mode != 'validate' }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_STATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials for sandbox operation
        if: ${{ inputs.mode != 'validate' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with remote backend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate before remote operation
        if: ${{ inputs.mode != 'validate' }}
        run: terraform validate

      - name: Ensure EKS access-entry authentication mode
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set +e
          current_mode=$(aws eks describe-cluster \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --query 'cluster.accessConfig.authenticationMode' \
            --output text 2>/tmp/eks-describe-error)
          describe_status=$?
          set -e

          if [ "$describe_status" -ne 0 ]; then
            if grep -q 'ResourceNotFoundException' /tmp/eks-describe-error; then
              echo "EKS cluster does not exist yet; Terraform will create the cluster first without access entries."
              echo "TF_VAR_enable_eks_access_entries=false" >> "$GITHUB_ENV"
              echo "::notice::Run apply again after the cluster is active to migrate authentication mode and create access entries."
              exit 0
            fi
            cat /tmp/eks-describe-error
            exit "$describe_status"
          fi

          if [ "$current_mode" = "API" ] || [ "$current_mode" = "API_AND_CONFIG_MAP" ]; then
            echo "EKS cluster authentication mode already supports access entries."
            exit 0
          fi

          echo "Updating EKS cluster authentication mode to API_AND_CONFIG_MAP before Terraform creates access entries."
          aws eks update-cluster-config \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" \
            --access-config authenticationMode=API_AND_CONFIG_MAP
          aws eks wait cluster-active \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Import existing EKS access entries
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ "${TF_VAR_enable_eks_access_entries}" != "true" ]; then
            echo "EKS access entries are disabled for this apply; skipping import preflight."
            exit 0
          fi

          policy_arn="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          import_access_entry() {
            address="$1"
            principal_arn="$2"

            if [ -z "$principal_arn" ]; then
              return 0
            fi

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "EKS access entry is already managed in Terraform state."
              return 0
            fi

            if aws eks describe-access-entry \
              --region "${AWS_REGION}" \
              --cluster-name "${EKS_CLUSTER_NAME}" \
              --principal-arn "$principal_arn" >/dev/null 2>&1; then
              echo "Importing existing EKS access entry into Terraform state."
              terraform import -no-color "$address" "${EKS_CLUSTER_NAME}:${principal_arn}" >/dev/null || {
                echo "::error::Failed to import existing EKS access entry."
                exit 1
              }
            fi
          }

          import_access_policy_association() {
            address="$1"
            principal_arn="$2"

            if [ -z "$principal_arn" ]; then
              return 0
            fi

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "EKS access policy association is already managed in Terraform state."
              return 0
            fi

            existing_policy=$(aws eks list-associated-access-policies \
              --region "${AWS_REGION}" \
              --cluster-name "${EKS_CLUSTER_NAME}" \
              --principal-arn "$principal_arn" \
              --query "associatedAccessPolicies[?policyArn=='${policy_arn}'].policyArn | [0]" \
              --output text 2>/dev/null || true)

            if [ "$existing_policy" = "$policy_arn" ]; then
              echo "Importing existing EKS access policy association into Terraform state."
              terraform import -no-color "$address" "${EKS_CLUSTER_NAME}#${principal_arn}#${policy_arn}" >/dev/null || {
                echo "::error::Failed to import existing EKS access policy association."
                exit 1
              }
            fi
          }

          import_access_entry \
            'module.eks.aws_eks_access_entry.github_actions[0]' \
            "${TF_VAR_github_actions_principal_arn}"
          import_access_policy_association \
            'module.eks.aws_eks_access_policy_association.github_actions[0]' \
            "${TF_VAR_github_actions_principal_arn}"

          import_access_entry \
            'module.eks.aws_eks_access_entry.local_operator[0]' \
            "${TF_VAR_local_operator_principal_arn}"
          import_access_policy_association \
            'module.eks.aws_eks_access_policy_association.local_operator[0]' \
            "${TF_VAR_local_operator_principal_arn}"

      - name: Terraform plan without saved artifact
        if: ${{ inputs.mode == 'plan' }}
        run: terraform plan -input=false -no-color

      - name: Terraform apply sandbox
        if: ${{ inputs.mode == 'apply' }}
        run: |
          echo "Running Terraform apply for the short-lived EKS sandbox."
          echo "Do not copy account IDs, ARNs, endpoints, kubeconfig, tfstate, or plan output into git."
          terraform apply -input=false -auto-approve -no-color

      - name: Terraform destroy sandbox
        if: ${{ inputs.mode == 'destroy' }}
        run: |
          echo "Running Terraform destroy for the short-lived EKS sandbox."
          echo "Capture only sanitized teardown evidence."
          terraform destroy -input=false -auto-approve -no-color
