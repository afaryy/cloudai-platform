name: terraform-eks-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform command mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - plan

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform EKS sandbox readiness
    runs-on: ubuntu-latest
    environment: aws-sandbox
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials for sandbox plan
        if: ${{ inputs.mode == 'plan' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-2

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform validate
        if: ${{ inputs.mode == 'validate' }}
        run: terraform validate

      - name: Explain sandbox plan boundary
        if: ${{ inputs.mode == 'plan' }}
        run: |
          echo "Plan mode is intentionally a readiness placeholder."
          echo "Add backend.tf privately from backend.tf.example before any real plan."
          echo "Do not commit backend.tf, tfvars, tfstate, tfplan, kubeconfig, or account-specific values."

      - name: Terraform plan placeholder
        if: ${{ inputs.mode == 'plan' }}
        run: terraform init -backend=false && terraform validate
