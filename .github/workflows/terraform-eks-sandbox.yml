name: terraform-eks-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform command mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform EKS sandbox readiness
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STACK_NAME: eks-sandbox
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/eks-sandbox/terraform.tfstate
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials for sandbox plan
        if: ${{ inputs.mode == 'plan' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform validate
        if: ${{ inputs.mode == 'validate' }}
        run: terraform validate

      - name: Explain sandbox plan boundary
        if: ${{ inputs.mode == 'plan' }}
        run: |
          echo "Plan mode initializes the remote S3 backend from aws-sandbox environment variables."
          echo "It does not create a saved tfplan artifact and does not run apply or destroy."
          echo "Do not commit tfvars, tfstate, tfplan, kubeconfig, account IDs, ARNs, endpoints, or credentials."

      - name: Check backend environment variables
        if: ${{ inputs.mode == 'plan' }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_STATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Terraform init with remote backend
        if: ${{ inputs.mode == 'plan' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate before plan
        if: ${{ inputs.mode == 'plan' }}
        run: terraform validate

      - name: Terraform plan without saved artifact
        if: ${{ inputs.mode == 'plan' }}
        run: terraform plan -input=false -no-color

      - name: Refuse apply or destroy until sandbox enablement PR
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'destroy' }}
        run: |
          echo "Mode '${{ inputs.mode }}' is intentionally disabled in this validate-only skeleton."
          echo "Enable real apply/destroy only after private backend, budget alarm, environment approval, and teardown evidence are confirmed."
          echo "Do not commit backend.tf, tfvars, tfstate, tfplan, kubeconfig, account IDs, ARNs, endpoints, or credentials."
          exit 1
