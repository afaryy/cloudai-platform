name: terraform-agentcore-rag-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform operation"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - bootstrap-plan
          - bootstrap-recover
          - bootstrap-apply
          - deploy-plan
          - deploy-apply
          - destroy-plan
      confirmation:
        description: "Required only for state recovery or apply: exact confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-agentcore-rag-sandbox
  cancel-in-progress: false

jobs:
  terraform:
    name: AgentCore RAG sandbox
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/agentcore-rag-sandbox/terraform.tfstate
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_OIDC_PROVIDER_ARN }}
      TF_VAR_knowledge_base_id: ${{ vars.AGENTCORE_RAG_KNOWLEDGE_BASE_ID }}
      TF_VAR_knowledge_base_arn: ${{ vars.AGENTCORE_RAG_KNOWLEDGE_BASE_ARN }}
      TF_VAR_model_arn: ${{ vars.AGENTCORE_RAG_MODEL_ARN }}
      TF_VAR_container_image_uri: ${{ vars.AGENTCORE_RAG_CONTAINER_IMAGE_URI }}
      TF_VAR_embedding_model_arn: ${{ vars.AGENTCORE_RAG_EMBEDDING_MODEL_ARN || 'arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.titan-embed-text-v2:0' }}
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/agentcore-rag-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain deployment boundary
        run: |
          echo "This workflow is the only deployment path for the AgentCore RAG sandbox."
          echo "GitHub Environment approval, OIDC, an explicit confirmation, and a reviewed plan are required for apply."
          echo "The sandbox accepts only synthetic data and has no anonymous gateway, write tools, memory, or browser access."

      - name: Check recovery or apply confirmation
        if: ${{ inputs.mode == 'bootstrap-recover' || inputs.mode == 'bootstrap-apply' || inputs.mode == 'deploy-apply' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "bootstrap-recover" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_STATE_RECOVERY" ]; then
            echo "::error::bootstrap-recover requires I_UNDERSTAND_AGENTCORE_RAG_STATE_RECOVERY."
            exit 1
          fi
          if [ "$MODE" = "bootstrap-apply" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_BOOTSTRAP_APPLY" ]; then
            echo "::error::bootstrap-apply requires I_UNDERSTAND_AGENTCORE_RAG_BOOTSTRAP_APPLY."
            exit 1
          fi
          if [ "$MODE" = "deploy-apply" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_DEPLOY_APPLY" ]; then
            echo "::error::deploy-apply requires I_UNDERSTAND_AGENTCORE_RAG_DEPLOY_APPLY."
            exit 1
          fi

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform format and validate
        if: ${{ inputs.mode == 'validate' }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Validate the synthetic RAG CloudFormation template
        if: ${{ inputs.mode == 'validate' }}
        working-directory: .
        run: pipx run cfn-lint providers/aws/infra/terraform/envs/agentcore-rag-sandbox/bedrock-rag-data-foundation.yaml

      - name: Check protected environment variables
        if: ${{ inputs.mode != 'validate' }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_VAR_github_oidc_provider_arn; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in aws-sandbox."
              missing=1
            fi
          done
          if [ "${{ inputs.mode }}" = "deploy-plan" ] || [ "${{ inputs.mode }}" = "deploy-apply" ]; then
            for name in TF_VAR_model_arn TF_VAR_container_image_uri; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is required to deploy the Runtime, Gateway, and Gateway Target."
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Configure AWS credentials through GitHub OIDC
        if: ${{ inputs.mode != 'validate' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with remote backend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Detect tainted ECR state before recovery
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        id: ecr_state
        run: |
          if terraform state pull | jq -e '.resources[] | select(.mode == "managed" and .type == "aws_ecr_repository" and .name == "runtime") | .instances[] | select(.status == "tainted")' >/dev/null; then
            echo "tainted=true" >> "$GITHUB_OUTPUT"
            echo "aws_ecr_repository.runtime is tainted."
          else
            echo "tainted=false" >> "$GITHUB_OUTPUT"
            echo "aws_ecr_repository.runtime is not tainted."
          fi

      - name: Verify empty ECR repository before ECR state recovery
        if: ${{ inputs.mode == 'bootstrap-recover' && steps.ecr_state.outputs.tainted == 'true' }}
        run: |
          image_count=$(aws ecr describe-images \
            --repository-name cloudai-platform-agentcore-rag-sandbox \
            --query 'length(imageDetails)' \
            --output text)
          if [ "$image_count" != "0" ]; then
            echo "::error::State recovery is blocked because the ECR repository contains $image_count image(s)."
            exit 1
          fi
          echo "The ECR repository is empty; ECR state recovery will not remove image data."

      - name: Recover a failed synthetic RAG data stack
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        run: |
          stack_name="cloudai-platform-agentcore-rag-data"
          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)
          if [ "$stack_status" = "ROLLBACK_FAILED" ] || [ "$stack_status" = "ROLLBACK_COMPLETE" ]; then
            echo "The synthetic RAG data stack is $stack_status; printing recent resource events before managed deletion."
            aws cloudformation describe-stack-events \
              --stack-name "$stack_name" \
              --query 'StackEvents[?ResourceStatusReason != `null`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            echo "Deleting the failed synthetic RAG data stack."
            aws cloudformation delete-stack --stack-name "$stack_name"
            aws cloudformation wait stack-delete-complete --stack-name "$stack_name"
            echo "Removed the failed synthetic RAG data stack; no source document was uploaded."
          elif [ -z "$stack_status" ] || [ "$stack_status" = "None" ]; then
            echo "No failed synthetic RAG data stack exists."
          else
            echo "Synthetic RAG data stack status is $stack_status; recovery will not mutate it."
            exit 1
          fi

      - name: Recover tainted ECR state
        if: ${{ inputs.mode == 'bootstrap-recover' && steps.ecr_state.outputs.tainted == 'true' }}
        run: |
          terraform untaint aws_ecr_repository.runtime
          echo "Removed the tainted marker from aws_ecr_repository.runtime."

      - name: Plan state recovery result
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        run: |
          terraform plan -input=false -var='enable_runtime=false' -var='enable_data=false' -out=tfplan

      - name: Plan ECR and IAM foundation
        if: ${{ inputs.mode == 'bootstrap-plan' || inputs.mode == 'bootstrap-apply' }}
        run: terraform plan -input=false -var='enable_runtime=false' -var='enable_data=true' -out=tfplan

      - name: Apply ECR and IAM foundation
        if: ${{ inputs.mode == 'bootstrap-apply' }}
        run: terraform apply -input=false tfplan

      - name: Plan runtime deployment
        if: ${{ inputs.mode == 'deploy-plan' || inputs.mode == 'deploy-apply' }}
        run: terraform plan -input=false -var='enable_runtime=true' -var='enable_data=true' -out=tfplan

      - name: Apply runtime deployment
        if: ${{ inputs.mode == 'deploy-apply' }}
        run: terraform apply -input=false tfplan

      - name: Plan teardown only
        if: ${{ inputs.mode == 'destroy-plan' }}
        run: terraform plan -destroy -input=false -var='enable_runtime=true' -var='enable_data=true'
