name: terraform-agentcore-rag-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform operation"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - bootstrap-plan
          - bootstrap-recover
          - bootstrap-apply
          - deploy-plan
          - deploy-apply
          - ingest
          - invoke
          - destroy-plan
      confirmation:
        description: "Required for recovery, apply, ingestion, or invocation: exact confirmation phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-agentcore-rag-sandbox
  cancel-in-progress: false

jobs:
  terraform:
    name: AgentCore RAG sandbox
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/agentcore-rag-sandbox/terraform.tfstate
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_OIDC_PROVIDER_ARN }}
      TF_VAR_knowledge_base_id: ${{ vars.AGENTCORE_RAG_KNOWLEDGE_BASE_ID }}
      TF_VAR_knowledge_base_arn: ${{ vars.AGENTCORE_RAG_KNOWLEDGE_BASE_ARN }}
      TF_VAR_model_arn: ${{ vars.AGENTCORE_RAG_MODEL_ARN }}
      TF_VAR_container_image_uri: ${{ vars.AGENTCORE_RAG_CONTAINER_IMAGE_URI }}
      TF_VAR_embedding_model_arn: ${{ vars.AGENTCORE_RAG_EMBEDDING_MODEL_ARN || 'arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.titan-embed-text-v2:0' }}
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/agentcore-rag-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain deployment boundary
        run: |
          echo "This workflow is the only deployment path for the AgentCore RAG sandbox."
          echo "GitHub Environment approval, OIDC, an explicit confirmation, and a reviewed plan are required for apply."
          echo "The sandbox accepts only synthetic data and has no anonymous gateway, write tools, memory, or browser access."

      - name: Check recovery, apply, ingestion, or invocation confirmation
        if: ${{ inputs.mode == 'bootstrap-recover' || inputs.mode == 'bootstrap-apply' || inputs.mode == 'deploy-apply' || inputs.mode == 'ingest' || inputs.mode == 'invoke' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "bootstrap-recover" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_STATE_RECOVERY" ]; then
            echo "::error::bootstrap-recover requires I_UNDERSTAND_AGENTCORE_RAG_STATE_RECOVERY."
            exit 1
          fi
          if [ "$MODE" = "bootstrap-apply" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_BOOTSTRAP_APPLY" ]; then
            echo "::error::bootstrap-apply requires I_UNDERSTAND_AGENTCORE_RAG_BOOTSTRAP_APPLY."
            exit 1
          fi
          if [ "$MODE" = "deploy-apply" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_DEPLOY_APPLY" ]; then
            echo "::error::deploy-apply requires I_UNDERSTAND_AGENTCORE_RAG_DEPLOY_APPLY."
            exit 1
          fi
          if [ "$MODE" = "ingest" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_INGESTION" ]; then
            echo "::error::ingest requires I_UNDERSTAND_AGENTCORE_RAG_INGESTION."
            exit 1
          fi
          if [ "$MODE" = "invoke" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_AGENTCORE_RAG_GATEWAY_INVOKE" ]; then
            echo "::error::invoke requires I_UNDERSTAND_AGENTCORE_RAG_GATEWAY_INVOKE."
            exit 1
          fi

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform format and validate
        if: ${{ inputs.mode == 'validate' }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Validate the synthetic RAG CloudFormation template
        if: ${{ inputs.mode == 'validate' }}
        working-directory: .
        run: pipx run cfn-lint providers/aws/infra/terraform/envs/agentcore-rag-sandbox/bedrock-rag-data-foundation.yaml

      - name: Check protected environment variables
        if: ${{ inputs.mode != 'validate' }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_VAR_github_oidc_provider_arn; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in aws-sandbox."
              missing=1
            fi
          done
          if [ "${{ inputs.mode }}" = "deploy-plan" ] || [ "${{ inputs.mode }}" = "deploy-apply" ]; then
            for name in TF_VAR_model_arn TF_VAR_container_image_uri; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is required to deploy the Runtime, Gateway, and Gateway Target."
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Configure AWS credentials through GitHub OIDC
        if: ${{ inputs.mode != 'validate' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with remote backend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Detect tainted ECR state before recovery
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        id: ecr_state
        run: |
          if terraform state pull | jq -e '.resources[] | select(.mode == "managed" and .type == "aws_ecr_repository" and .name == "runtime") | .instances[] | select(.status == "tainted")' >/dev/null; then
            echo "tainted=true" >> "$GITHUB_OUTPUT"
            echo "aws_ecr_repository.runtime is tainted."
          else
            echo "tainted=false" >> "$GITHUB_OUTPUT"
            echo "aws_ecr_repository.runtime is not tainted."
          fi

      - name: Verify empty ECR repository before ECR state recovery
        if: ${{ inputs.mode == 'bootstrap-recover' && steps.ecr_state.outputs.tainted == 'true' }}
        run: |
          image_count=$(aws ecr describe-images \
            --repository-name cloudai-platform-agentcore-rag-sandbox \
            --query 'length(imageDetails)' \
            --output text)
          if [ "$image_count" != "0" ]; then
            echo "::error::State recovery is blocked because the ECR repository contains $image_count image(s)."
            exit 1
          fi
          echo "The ECR repository is empty; ECR state recovery will not remove image data."

      - name: Recover a failed synthetic RAG data stack
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        run: |
          stack_name="cloudai-platform-agentcore-rag-data"
          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$stack_name" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)
          if [ "$stack_status" = "ROLLBACK_FAILED" ] || [ "$stack_status" = "ROLLBACK_COMPLETE" ]; then
            echo "The synthetic RAG data stack is $stack_status; printing recent resource events before managed deletion."
            aws cloudformation describe-stack-events \
              --stack-name "$stack_name" \
              --query 'StackEvents[?ResourceStatusReason != `null`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            echo "Deleting the failed synthetic RAG data stack."
            aws cloudformation delete-stack --stack-name "$stack_name"
            aws cloudformation wait stack-delete-complete --stack-name "$stack_name"
            echo "Removed the failed synthetic RAG data stack; no source document was uploaded."
          elif [ -z "$stack_status" ] || [ "$stack_status" = "None" ]; then
            echo "No failed synthetic RAG data stack exists."
          else
            echo "Synthetic RAG data stack status is $stack_status; recovery will not mutate it."
            exit 1
          fi

      - name: Recover tainted ECR state
        if: ${{ inputs.mode == 'bootstrap-recover' && steps.ecr_state.outputs.tainted == 'true' }}
        run: |
          terraform untaint aws_ecr_repository.runtime
          echo "Removed the tainted marker from aws_ecr_repository.runtime."

      - name: Plan state recovery result
        if: ${{ inputs.mode == 'bootstrap-recover' }}
        run: |
          terraform plan -input=false -var='enable_runtime=false' -var='enable_data=false' -out=tfplan

      - name: Plan ECR and IAM foundation
        if: ${{ inputs.mode == 'bootstrap-plan' || inputs.mode == 'bootstrap-apply' }}
        run: terraform plan -input=false -var='enable_runtime=false' -var='enable_data=true' -out=tfplan

      - name: Apply ECR and IAM foundation
        if: ${{ inputs.mode == 'bootstrap-apply' }}
        run: terraform apply -input=false tfplan

      - name: Plan runtime deployment
        if: ${{ inputs.mode == 'deploy-plan' || inputs.mode == 'deploy-apply' }}
        run: terraform plan -input=false -var='enable_runtime=true' -var='enable_data=true' -out=tfplan

      - name: Apply runtime deployment
        if: ${{ inputs.mode == 'deploy-apply' }}
        run: terraform apply -input=false tfplan

      - name: Start and monitor synthetic Knowledge Base ingestion
        if: ${{ inputs.mode == 'ingest' }}
        id: ingestion
        run: |
          set -euo pipefail
          kb_id=$(terraform output -raw knowledge_base_id)
          data_source_id=$(terraform output -raw knowledge_base_data_source_id)
          if [[ ! "$kb_id" =~ ^[A-Za-z0-9]{10}$ || ! "$data_source_id" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "::error::Terraform outputs did not contain valid Knowledge Base and data source IDs."
            exit 1
          fi
          client_token="cloudai-platform-agentcore-rag-ingestion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job_json="$RUNNER_TEMP/agentcore-ingestion-start.json"
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id "$kb_id" \
            --data-source-id "$data_source_id" \
            --client-token "$client_token" \
            --description "Synthetic AgentCore RAG handbook ingestion from GitHub Actions" \
            --output json > "$job_json"
          job_id=$(jq -r '.ingestionJob.ingestionJobId' "$job_json")
          if [[ ! "$job_id" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "::error::StartIngestionJob did not return a valid ingestion job ID."
            cat "$job_json"
            exit 1
          fi
          echo "Started synthetic ingestion job $job_id for Knowledge Base $kb_id."
          for attempt in $(seq 1 30); do
            status_json="$RUNNER_TEMP/agentcore-ingestion-status.json"
            aws bedrock-agent get-ingestion-job \
              --knowledge-base-id "$kb_id" \
              --data-source-id "$data_source_id" \
              --ingestion-job-id "$job_id" \
              --output json > "$status_json"
            status=$(jq -r '.ingestionJob.status' "$status_json")
            echo "Ingestion poll $attempt/30: $status"
            if [ "$status" = "COMPLETE" ]; then
              echo "Ingestion is COMPLETE; allowing S3 Vectors propagation before a follow-up query."
              sleep 30
              cp "$status_json" "$RUNNER_TEMP/agentcore-ingestion-result.json"
              echo "kb_id=$kb_id" >> "$GITHUB_OUTPUT"
              echo "data_source_id=$data_source_id" >> "$GITHUB_OUTPUT"
              echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
              echo "status=COMPLETE" >> "$GITHUB_OUTPUT"
              echo "documents_scanned=$(jq -r '.ingestionJob.statistics.numberOfDocumentsScanned // 0' "$status_json")" >> "$GITHUB_OUTPUT"
              echo "documents_indexed=$(jq -r '.ingestionJob.statistics.numberOfNewDocumentsIndexed // 0' "$status_json")" >> "$GITHUB_OUTPUT"
              echo "documents_failed=$(jq -r '.ingestionJob.statistics.numberOfDocumentsFailed // 0' "$status_json")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "FAILED" ] || [ "$status" = "STOPPED" ]; then
              cp "$status_json" "$RUNNER_TEMP/agentcore-ingestion-result.json"
              echo "::error::Synthetic Knowledge Base ingestion ended with status $status."
              jq -r '.ingestionJob.failureReasons[]? // empty' "$status_json"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Synthetic Knowledge Base ingestion did not complete within 10 minutes."
          exit 1

      - name: Preflight direct Bedrock RAG configuration
        if: ${{ inputs.mode == 'invoke' }}
        run: |
          set -euo pipefail
          kb_id=$(terraform output -raw knowledge_base_id)
          model_arn=$(terraform state show 'aws_bedrock_inference_profile.generation[0]' \
            | awk -F' = ' '$1 == "arn" {print $2; exit}')
          if [ -z "$model_arn" ]; then
            echo "::error::The generated application inference profile ARN was not found in Terraform state."
            exit 1
          fi
          request_file="${GITHUB_WORKSPACE}/shared/examples/agentcore-rag-poc/active-cited-answer.request.json"
          response_file="$RUNNER_TEMP/bedrock-retrieve-and-generate-response.json"
          error_file="$RUNNER_TEMP/bedrock-retrieve-and-generate-error.txt"
          set +e
          aws bedrock-agent-runtime retrieve-and-generate \
            --region "$AWS_REGION" \
            --input "$(jq -c '{text: .question}' "$request_file")" \
            --retrieve-and-generate-configuration "$(jq -cn \
              --arg kb_id "$kb_id" \
              --arg model_arn "$model_arn" \
              '{type: "KNOWLEDGE_BASE", knowledgeBaseConfiguration: {knowledgeBaseId: $kb_id, modelArn: $model_arn}}')" \
            --output json >"$response_file" 2>"$error_file"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Direct Bedrock RetrieveAndGenerate preflight failed (the AgentCore invoke will still run):"
            sed -E 's/(arn:aws:[^ ]*:[0-9]{12})/arn:aws:*:*:ACCOUNT/g' "$error_file"
            exit 0
          fi
          echo "Direct Bedrock RetrieveAndGenerate preflight succeeded:"
          jq '{output: .output.text, citationCount: (.citations | length)}' "$response_file"

      - name: Upload synthetic ingestion evidence
        if: ${{ always() && inputs.mode == 'ingest' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-rag-ingestion-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agentcore-ingestion-start.json
            ${{ runner.temp }}/agentcore-ingestion-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Invoke synthetic request through AgentCore Gateway
        if: ${{ inputs.mode == 'invoke' }}
        id: invocation
        working-directory: .
        run: |
          set -euo pipefail
          runtime_arn=$(terraform -chdir=providers/aws/infra/terraform/envs/agentcore-rag-sandbox output -raw agent_runtime_arn)
          gateway_url=$(terraform -chdir=providers/aws/infra/terraform/envs/agentcore-rag-sandbox output -raw gateway_url)
          gateway_authorizer=$(terraform -chdir=providers/aws/infra/terraform/envs/agentcore-rag-sandbox output -raw gateway_authorizer_type)
          endpoint="${gateway_url%/}/governed-rag-runtime"
          if [ "$gateway_authorizer" != "AWS_IAM" ]; then
            echo "::error::Gateway authorizer is $gateway_authorizer; this test requires AWS_IAM."
            exit 1
          fi
          case "$endpoint" in
            */governed-rag-runtime) ;;
            *) echo "::error::Gateway endpoint is not the expected governed-rag-runtime target."; exit 1 ;;
          esac
          request_file="shared/examples/agentcore-rag-poc/active-cited-answer.request.json"
          response_file="$RUNNER_TEMP/agentcore-gateway-response.json"
          aws bedrock-agentcore invoke-agent-runtime \
            --endpoint-url "$endpoint" \
            --agent-runtime-arn "$runtime_arn" \
            --content-type application/json \
            --accept application/json \
            --payload "fileb://$GITHUB_WORKSPACE/$request_file" \
            "$response_file"
          echo "Gateway response:"
          jq . "$response_file"
          jq -e '
            .requestId == "synthetic-request-active-001" and
            .outcome == "answer" and
            (.citations | length) > 0 and
            .audit.citationPresent == true and
            .audit.sourceLifecycle == "active"
          ' "$response_file" >/dev/null
          jq -n \
            --arg endpoint "$endpoint" \
            --arg runtime_arn "$runtime_arn" \
            --slurpfile request "$GITHUB_WORKSPACE/$request_file" \
            --slurpfile response "$response_file" \
            '{endpoint: $endpoint, runtimeArn: $runtime_arn, request: $request[0], response: $response[0]}' \
            > "$RUNNER_TEMP/agentcore-gateway-evidence.json"
          echo "response_file=$response_file" >> "$GITHUB_OUTPUT"

      - name: Upload synthetic gateway evidence
        if: ${{ always() && inputs.mode == 'invoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-rag-gateway-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/agentcore-gateway-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Plan teardown only
        if: ${{ inputs.mode == 'destroy-plan' }}
        run: terraform plan -destroy -input=false -var='enable_runtime=true' -var='enable_data=true'
