name: terraform-eks-gpu-kueue-poc

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded GPU POC operation"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - plan
          - apply
          - validate
          - stop
      confirmation:
        description: "Exact confirmation phrase required for apply or stop"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-eks-sandbox-control-plane
  cancel-in-progress: false

jobs:
  gpu_poc:
    name: Bounded EKS GPU Kueue POC
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/eks-gpu-kueue-poc/terraform.tfstate
      TF_VAR_gpu_instance_type: ${{ vars.TF_VAR_GPU_INSTANCE_TYPE }}
      TF_VAR_cuda_smoke_image: ${{ vars.TF_VAR_CUDA_SMOKE_IMAGE }}
      TF_VAR_kueue_chart_version: ${{ vars.TF_VAR_KUEUE_CHART_VERSION }}
      TF_VAR_gpu_min_size: "0"
      TF_VAR_gpu_max_size: "1"
      GPU_POC_BUDGET_ALERT_CONFIGURED: ${{ vars.GPU_POC_BUDGET_ALERT_CONFIGURED }}
      EKS_CLUSTER_NAME: cloudai-platform-eks-sandbox
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/eks-gpu-kueue-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain bounded lifecycle
        run: |
          echo "This workflow attaches only to the existing EKS sandbox and operates a single synthetic GPU POC node."
          echo "It does not create an EKS cluster, change a service quota, retry capacity, or select a fallback instance type."
          echo "Apply sets desired GPU capacity to one; stop sets desired GPU capacity to zero."

      - name: Validate Terraform source without backend
        if: ${{ inputs.mode == 'validate' }}
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
          terraform test

      - name: Check protected environment values
        env:
          MODE: ${{ inputs.mode }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX GPU_POC_BUDGET_ALERT_CONFIGURED; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment."
              missing=1
            fi
          done
          if [ "$GPU_POC_BUDGET_ALERT_CONFIGURED" != "true" ]; then
            echo "::error::GPU_POC_BUDGET_ALERT_CONFIGURED must be exactly true before any remote POC operation."
            missing=1
          fi
          if [ "$MODE" != "validate" ]; then
            for name in TF_VAR_gpu_instance_type TF_VAR_cuda_smoke_image TF_VAR_kueue_chart_version; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is required for Terraform remote operations."
                missing=1
              fi
            done
            if ! printf '%s' "$TF_VAR_cuda_smoke_image" | grep -Eq '@sha256:[a-f0-9]{64}$'; then
              echo "::error::TF_VAR_cuda_smoke_image must be a digest-pinned image reference."
              missing=1
            fi
          fi
          exit "$missing"

      - name: Check apply or stop confirmation
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'stop' }}
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_EKS_GPU_KUEUE_POC_APPLY" ]; then
            echo "::error::apply requires I_UNDERSTAND_EKS_GPU_KUEUE_POC_APPLY."
            exit 1
          fi
          if [ "$MODE" = "stop" ] && [ "$CONFIRMATION" != "I_UNDERSTAND_EKS_GPU_KUEUE_POC_STOP" ]; then
            echo "::error::stop requires I_UNDERSTAND_EKS_GPU_KUEUE_POC_STOP."
            exit 1
          fi

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with isolated remote backend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Preflight existing EKS, quota, and offering
        if: ${{ inputs.mode == 'preflight' || inputs.mode == 'apply' || inputs.mode == 'validate' }}
        working-directory: .
        run: |
          cluster_json=$(aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --output json)
          cluster_status=$(jq -r '.cluster.status' <<<"$cluster_json")
          cluster_version=$(jq -r '.cluster.version' <<<"$cluster_json")
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "::error::Existing EKS sandbox must be ACTIVE; this workflow will not create or recover it."
            exit 1
          fi

          quota_value=$(aws service-quotas list-service-quotas \
            --service-code ec2 \
            --region "$AWS_REGION" \
            --query 'Quotas[?contains(QuotaName, `Running On-Demand G and VT instances`)].Value | [0]' \
            --output text)
          if [ -z "$quota_value" ] || [ "$quota_value" = "None" ] || [ "$quota_value" = "0" ]; then
            echo "::error::The selected on-demand GPU quota is unavailable. This workflow will not request a quota increase."
            exit 1
          fi

          offering_count=$(aws ec2 describe-instance-type-offerings \
            --region "$AWS_REGION" \
            --location-type availability-zone \
            --filters "Name=instance-type,Values=$TF_VAR_gpu_instance_type" \
            --query 'length(InstanceTypeOfferings)' \
            --output text)
          if [ "$offering_count" = "0" ]; then
            echo "::error::The selected GPU instance type has no eligible regional offering. This workflow will not substitute another type."
            exit 1
          fi

          printf '{"cluster_active":true,"cluster_version_checked":%s,"budget_alert_configured":true,"gpu_quota_available":true,"instance_offering_available":true,"digest_pinned_image":true}\n' \
            "$( [ -n "$cluster_version" ] && echo true || echo false )" > /tmp/gpu-poc-preflight-evidence.json

      - name: Upload sanitised preflight evidence
        if: ${{ inputs.mode == 'preflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: eks-gpu-kueue-poc-preflight-evidence
          path: /tmp/gpu-poc-preflight-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Terraform plan without saved artifact
        if: ${{ inputs.mode == 'plan' }}
        run: |
          terraform validate
          terraform plan -input=false -no-color

      - name: Apply one-node GPU POC after fresh plan
        if: ${{ inputs.mode == 'apply' }}
        run: |
          echo "TF_VAR_gpu_desired_size=1" >> "$GITHUB_ENV"
          terraform validate
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -auto-approve -no-color tfplan

      - name: Validate Kueue admission and synthetic CUDA completion
        if: ${{ inputs.mode == 'validate' }}
        working-directory: .
        env:
          KUBECONFIG: /tmp/eks-gpu-kueue-poc-kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          gpu_count=$(kubectl get nodes -l cloudai.platform/workload-class=gpu-poc -o json | jq '[.items[].status.allocatable["nvidia.com/gpu"] // "0" | tonumber] | add // 0')
          if [ "$gpu_count" != "1" ]; then
            echo "::error::Expected exactly one allocatable GPU from the bounded GPU POC node group."
            exit 1
          fi
          kubectl get workload -n gpu-poc -o json | jq -e '.items[] | select(any(.status.conditions[]?; .type == "Admitted" and .status == "True"))' >/dev/null
          kubectl wait --for=condition=complete job/cuda-smoke -n gpu-poc --timeout=6m
          echo '{"one_allocatable_gpu":true,"kueue_admitted":true,"synthetic_cuda_job_completed":true}' > /tmp/gpu-poc-validation-evidence.json

      - name: Upload sanitised validation evidence
        if: ${{ inputs.mode == 'validate' }}
        uses: actions/upload-artifact@v4
        with:
          name: eks-gpu-kueue-poc-validation-evidence
          path: /tmp/gpu-poc-validation-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop GPU POC by scaling only to zero
        if: ${{ inputs.mode == 'stop' }}
        run: |
          echo "TF_VAR_gpu_desired_size=0" >> "$GITHUB_ENV"
          terraform validate
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -auto-approve -no-color tfplan
