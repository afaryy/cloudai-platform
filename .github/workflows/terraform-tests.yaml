name: terraform-tests

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-tests.yaml"
      - ".github/workflows/terraform-bedrock-sandbox.yml"
      - ".github/workflows/bedrock-gateway-adapter.yml"
      - "providers/aws/infra/terraform/**"
      - "providers/aws/app/api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-tests.yaml"
      - ".github/workflows/terraform-bedrock-sandbox.yml"
      - ".github/workflows/bedrock-gateway-adapter.yml"
      - "providers/aws/infra/terraform/**"
      - "providers/aws/app/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_dir:
          - providers/aws/infra/terraform/modules/network
          - providers/aws/infra/terraform/modules/eks
          - providers/aws/infra/terraform/modules/bedrock-access
          - providers/aws/infra/terraform/envs/eks-sandbox
          - providers/aws/infra/terraform/envs/bedrock-sandbox
    defaults:
      run:
        working-directory: ${{ matrix.terraform_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt
        working-directory: providers/aws/infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test

  bedrock_workflow_boundary:
    name: Bedrock apply workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check manual Bedrock IAM apply boundary
        run: |
          workflow=.github/workflows/terraform-bedrock-sandbox.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q -- '- apply' "$workflow"
          grep -q 'I_UNDERSTAND_BEDROCK_IAM_APPLY' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'vars.AWS_OIDC_PROVIDER_ARN' "$workflow"
          ! grep -q 'vars.GITHUB_OIDC_PROVIDER_ARN' "$workflow"
          ! grep -q 'secrets.GITHUB_OIDC_PROVIDER_ARN' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q "inputs.mode == 'apply'" "$workflow"
          grep -q 'Terraform plan before Bedrock IAM apply' "$workflow"
          grep -q 'terraform apply -input=false -auto-approve -no-color' "$workflow"
          grep -q -- '- smoke-test' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL' "$workflow"
          grep -q 'AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'AWS_MAX_ATTEMPTS: "1"' "$workflow"
          grep -q 'aws bedrock-runtime converse' "$workflow"
          grep -q 'category=access-denied' "$workflow"
          grep -q 'category=validation-or-inference-profile-required' "$workflow"
          ! grep -q 'cat "\$error_file"' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          ! grep -q 'bedrock:InvokeModel' "$workflow"
          ! grep -q 'aws bedrock ' "$workflow"
          grep -q -- '- guardrail-smoke-test' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_GUARDED_BEDROCK_CALL' "$workflow"
          grep -q 'AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'terraform output -raw bedrock_guardrail_id' "$workflow"
          grep -q 'terraform output -raw bedrock_guardrail_version' "$workflow"
          grep -q -- '--guardrail-config' "$workflow"
          grep -q 'trace:"disabled"' "$workflow"
          grep -q 'guardrail-attached-passed' "$workflow"
          test "$(grep -c -- '--guardrail-config' "$workflow")" -eq 1
          grep -q '::add-mask::$guardrail_id' "$workflow"
          grep -q '::add-mask::$guardrail_version' "$workflow"
          module=providers/aws/infra/terraform/modules/bedrock-access/main.tf
          grep -q 'guardrail_identifier_with_version' "$module"
          grep -q 'bedrock:GuardrailIdentifier' "$module"
          grep -q 'bedrock:ApplyGuardrail' "$module"
          grep -q 'resources = \[aws_bedrock_guardrail.sandbox.guardrail_arn\]' "$module"
          outputs=providers/aws/infra/terraform/modules/bedrock-access/outputs.tf
          grep -A3 'output "bedrock_guardrail_id"' "$outputs" | grep -Eq 'sensitive[[:space:]]*=[[:space:]]*true'
          grep -A3 'output "bedrock_guardrail_version"' "$outputs" | grep -Eq 'sensitive[[:space:]]*=[[:space:]]*true'

  bedrock_gateway_adapter_workflow_boundary:
    name: Bedrock gateway adapter workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check manual adapter smoke boundary
        run: |
          workflow=.github/workflows/bedrock-gateway-adapter.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q 'AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'MODEL_PROVIDER: bedrock' "$workflow"
          grep -q 'AWS_MAX_ATTEMPTS: "1"' "$workflow"
          grep -q 'pnpm run bedrock:smoke' "$workflow"
          ! grep -Eq 'terraform (init|plan|apply|destroy)' "$workflow"
          ! grep -q 'aws bedrock-runtime' "$workflow"
          ! grep -q 'bedrock:InvokeModel' "$workflow"
          ! grep -q 'iam:PassRole' "$workflow"
