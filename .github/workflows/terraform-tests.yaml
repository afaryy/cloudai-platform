name: terraform-tests

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-tests.yaml"
      - ".github/workflows/terraform-bedrock-sandbox.yml"
      - ".github/workflows/terraform-cost-guardrails.yml"
      - ".github/workflows/update-aws-bootstrap.yml"
      - ".github/workflows/recover-budget-guardrails-orphan.yml"
      - "providers/aws/infra/bootstrap/**"
      - ".github/workflows/bedrock-gateway-adapter.yml"
      - ".github/workflows/terraform-eks-gpu-kueue-poc.yml"
      - ".github/workflows/terraform-eks-private-sandbox.yml"
      - "providers/aws/infra/terraform/**"
      - "providers/aws/app/api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-tests.yaml"
      - ".github/workflows/terraform-bedrock-sandbox.yml"
      - ".github/workflows/terraform-cost-guardrails.yml"
      - ".github/workflows/update-aws-bootstrap.yml"
      - ".github/workflows/recover-budget-guardrails-orphan.yml"
      - "providers/aws/infra/bootstrap/**"
      - ".github/workflows/bedrock-gateway-adapter.yml"
      - ".github/workflows/terraform-eks-gpu-kueue-poc.yml"
      - ".github/workflows/terraform-eks-private-sandbox.yml"
      - "providers/aws/infra/terraform/**"
      - "providers/aws/app/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_dir:
          - providers/aws/infra/terraform/modules/network
          - providers/aws/infra/terraform/modules/eks
          - providers/aws/infra/terraform/modules/bedrock-access
          - providers/aws/infra/terraform/modules/eks-gpu-kueue
          - providers/aws/infra/terraform/envs/eks-sandbox
          - providers/aws/infra/terraform/envs/eks-gpu-kueue-poc
          - providers/aws/infra/terraform/envs/eks-private-sandbox
          - providers/aws/infra/terraform/envs/bedrock-sandbox
          - providers/aws/infra/terraform/envs/agentcore-rag-sandbox
    defaults:
      run:
        working-directory: ${{ matrix.terraform_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt
        working-directory: providers/aws/infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test

  bedrock_workflow_boundary:
    name: Bedrock apply workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check manual Bedrock IAM apply boundary
        run: |
          workflow=.github/workflows/terraform-bedrock-sandbox.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q -- '- apply' "$workflow"
          grep -q 'I_UNDERSTAND_BEDROCK_IAM_APPLY' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'vars.AWS_OIDC_PROVIDER_ARN' "$workflow"
          ! grep -q 'vars.GITHUB_OIDC_PROVIDER_ARN' "$workflow"
          ! grep -q 'secrets.GITHUB_OIDC_PROVIDER_ARN' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q "inputs.mode == 'apply'" "$workflow"
          grep -q 'Terraform plan before Bedrock IAM apply' "$workflow"
          grep -q 'terraform apply -input=false -auto-approve -no-color' "$workflow"
          grep -q -- '- smoke-test' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL' "$workflow"
          grep -q 'AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'AWS_MAX_ATTEMPTS: "1"' "$workflow"
          grep -q 'aws bedrock-runtime converse' "$workflow"
          grep -q 'category=access-denied' "$workflow"
          grep -q 'category=validation-or-inference-profile-required' "$workflow"
          ! grep -q 'cat "\$error_file"' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          ! grep -q 'bedrock:InvokeModel' "$workflow"
          ! grep -q 'aws bedrock ' "$workflow"
          grep -q -- '- guardrail-smoke-test' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_GUARDED_BEDROCK_CALL' "$workflow"
          grep -q 'AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'terraform output -raw bedrock_guardrail_id' "$workflow"
          grep -q 'terraform output -raw bedrock_guardrail_version' "$workflow"
          grep -q -- '--guardrail-config' "$workflow"
          grep -q 'trace:"disabled"' "$workflow"
          grep -q 'guardrail-attached-passed' "$workflow"
          test "$(grep -c -- '--guardrail-config' "$workflow")" -eq 1
          grep -q '::add-mask::$guardrail_id' "$workflow"
          grep -q '::add-mask::$guardrail_version' "$workflow"
          grep -q -- '- guardrail-evaluation' "$workflow"
          grep -q 'I_UNDERSTAND_THREE_SYNTHETIC_GUARDRAIL_EVALUATIONS' "$workflow"
          grep -q "inputs.mode == 'guardrail-evaluation'" "$workflow"
          grep -q 'aws bedrock-runtime apply-guardrail' "$workflow"
          grep -q -- '--source INPUT' "$workflow"
          grep -q 'safe-synthetic' "$workflow"
          grep -q 'pii-shaped-synthetic' "$workflow"
          grep -q 'prompt-attack-shaped-synthetic' "$workflow"
          grep -q 'guardrail-evaluation-passed' "$workflow"
          grep -q 'category=unexpected-verdict' "$workflow"
          test "$(grep -c 'aws bedrock-runtime apply-guardrail' "$workflow")" -eq 1
          ! grep -A120 'Invoke three synthetic direct Guardrail evaluations' "$workflow" | grep -q 'bedrock-runtime converse'
          module=providers/aws/infra/terraform/modules/bedrock-access/main.tf
          grep -q 'guardrail_identifier_with_version' "$module"
          grep -q 'bedrock:GuardrailIdentifier' "$module"
          grep -q 'bedrock:ApplyGuardrail' "$module"
          grep -q 'resources = \[aws_bedrock_guardrail.sandbox.guardrail_arn\]' "$module"
          outputs=providers/aws/infra/terraform/modules/bedrock-access/outputs.tf
          grep -A3 'output "bedrock_guardrail_id"' "$outputs" | grep -Eq 'sensitive[[:space:]]*=[[:space:]]*true'
          grep -A3 'output "bedrock_guardrail_version"' "$outputs" | grep -Eq 'sensitive[[:space:]]*=[[:space:]]*true'

  cost_guardrails_workflow_boundary:
    name: Cost Guardrails workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check protected cost guardrails delivery boundary
        run: |
          workflow=.github/workflows/terraform-cost-guardrails.yml
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'I_UNDERSTAND_COST_GUARDRAILS_APPLY' "$workflow"
          grep -q 'AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME' "$workflow"
          grep -q 'AWS_BUDGET_ALERT_EMAIL' "$workflow"
          grep -q 'terraform init -backend=false' "$workflow"
          grep -q 'terraform apply -input=false -auto-approve -no-color' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          ! grep -q 'echo.*AWS_BUDGET_ALERT_EMAIL' "$workflow"

  bootstrap_budget_guardrails_handoff_boundary:
    name: Bootstrap Budget Guardrails handoff boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check dedicated role handoff is available after bootstrap apply
        run: |
          workflow=.github/workflows/update-aws-bootstrap.yml
          grep -q 'Publish Budget Guardrails role handoff' "$workflow"
          grep -q "BudgetGuardrailsRoleArn" "$workflow"
          grep -q 'GITHUB_STEP_SUMMARY' "$workflow"
          grep -q "inputs.mode == 'apply' && success()" "$workflow"
          grep -q 'printf .*budget_guardrails_role_arn' "$workflow"
          ! grep -q 'echo.*AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME' "$workflow"
          ! grep -q 'AWS_BUDGET_ALERT_EMAIL' "$workflow"

  budget_guardrails_orphan_recovery_boundary:
    name: Budget Guardrails orphan recovery boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check fail-closed orphan recovery boundary
        run: |
          workflow=.github/workflows/recover-budget-guardrails-orphan.yml
          test -f "$workflow"
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q -- '- inspect' "$workflow"
          grep -q -- '- recover' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q 'cloudai-platform-aws-sandbox-budget-guardrails' "$workflow"
          grep -q 'I_UNDERSTAND_BUDGET_GUARDRAILS_ORPHAN_ROLE_RECOVERY' "$workflow"
          grep -q 'cloudformation describe-stack-resources' "$workflow"
          grep -q 'iam get-role' "$workflow"
          grep -q 'iam list-role-policies' "$workflow"
          grep -q 'iam list-attached-role-policies' "$workflow"
          grep -q 'iam list-role-tags' "$workflow"
          grep -A3 -F 'aws iam delete-role-policy \' "$workflow" | grep -q -- '--role-name "$ROLE_NAME"'
          grep -q -F 'aws iam delete-role --role-name "$ROLE_NAME"' "$workflow"
          grep -q 'GITHUB_STEP_SUMMARY' "$workflow"
          grep -q 'inputs.mode == '\''recover'\''' "$workflow"
          grep -q 'Result: managed' "$workflow"
          ! grep -q 'target_role_name' "$workflow"
          ! grep -q 'AWS_BUDGET_ALERT_EMAIL' "$workflow"
          ! grep -Eq 'aws iam delete-role --role-name[[:space:]]+\\*' "$workflow"
          runbook=docs/solutions/yy-44-cost-guardrails-runbook.md
          grep -q 'Separate orphan-role recovery path' "$runbook"
          grep -q 'I_UNDERSTAND_BUDGET_GUARDRAILS_ORPHAN_ROLE_RECOVERY' "$runbook"
          grep -q 'mode=inspect' "$runbook"
          grep -q 'mode=recover' "$runbook"

  bedrock_gateway_adapter_workflow_boundary:
    name: Bedrock gateway adapter workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check manual adapter smoke boundary
        run: |
          workflow=.github/workflows/bedrock-gateway-adapter.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q 'I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q 'AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME' "$workflow"
          grep -q 'MODEL_PROVIDER: bedrock' "$workflow"
          grep -q 'AWS_MAX_ATTEMPTS: "1"' "$workflow"
          grep -q 'pnpm run bedrock:smoke' "$workflow"
          ! grep -Eq 'terraform (init|plan|apply|destroy)' "$workflow"
          ! grep -q 'aws bedrock-runtime' "$workflow"
          ! grep -q 'bedrock:InvokeModel' "$workflow"
          ! grep -q 'iam:PassRole' "$workflow"

  eks_gpu_kueue_poc_workflow_boundary:
    name: EKS GPU Kueue POC workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check bounded manual GPU POC lifecycle
        run: |
          workflow=.github/workflows/terraform-eks-gpu-kueue-poc.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q 'environment: aws-sandbox' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q 'I_UNDERSTAND_EKS_GPU_KUEUE_POC_APPLY' "$workflow"
          grep -q 'I_UNDERSTAND_EKS_GPU_KUEUE_POC_STOP' "$workflow"
          grep -q -- '- preflight' "$workflow"
          grep -q -- '- plan' "$workflow"
          grep -q -- '- apply' "$workflow"
          grep -q -- '- validate' "$workflow"
          grep -q -- '- stop' "$workflow"
          grep -q -- '- discover' "$workflow"
          grep -q "inputs.mode == 'discover'" "$workflow"
          grep -q 'Discovery is read-only' "$workflow"
          grep -q 'GPU discovery evidence' "$workflow"
          grep -q 'GPU_POC_BUDGET_ALERT_CONFIGURED' "$workflow"
          grep -q 'TF_VAR_gpu_poc_subnet_ids' "$workflow"
          grep -q 'aws service-quotas list-service-quotas' "$workflow"
          grep -q 'describe-subnets' "$workflow"
          grep -q 'TF_VAR_gpu_desired_size=1' "$workflow"
          grep -q 'TF_VAR_gpu_desired_size=0' "$workflow"
          ! grep -q 'TF_VAR_gpu_desired_size=.*>>.*GITHUB_ENV' "$workflow"
          grep -q 'QuotaReserved' "$workflow"
          grep -q 'gpu-poc-on-demand' "$workflow"
          grep -q 'raw Terraform output is not published' "$workflow"
          grep -q 'inputs.mode != '\''validate'\''' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          grep -q 'aws ec2 describe-instance-type-offerings' "$workflow"
          grep -q 'auth.docker.io/token' "$workflow"
          grep -q 'registry-1.docker.io/v2/nvidia/cuda/manifests' "$workflow"
          grep -q 'TF_VAR_gpu_desired_size=1' "$workflow"
          grep -q 'TF_VAR_gpu_desired_size=0' "$workflow"
          grep -q 'kubectl get workloads.kueue.x-k8s.io -n gpu-poc' "$workflow"
          grep -q 'one_allocatable_gpu' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          ! grep -q '^  schedule:' "$workflow"

  eks_private_sandbox_workflow_boundary:
    name: Private EKS sandbox workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check protected private EKS delivery boundary
        run: |
          workflow=.github/workflows/terraform-eks-private-sandbox.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q -- '- validate' "$workflow"
          grep -q -- '- plan' "$workflow"
          grep -q -- '- preflight' "$workflow"
          grep -q -- '- apply' "$workflow"
          grep -q -- '- stop' "$workflow"
          grep -q 'runs-on: \[self-hosted, private-eks, ap-southeast-2\]' "$workflow"
          grep -q 'environment: aws-private-eks' "$workflow"
          grep -q 'id-token: write' "$workflow"
          grep -q 'cloudai-eks-private-sandbox-delivery' "$workflow"
          grep -q 'eks-private-sandbox/terraform.tfstate' "$workflow"
          grep -q 'PRIVATE_EKS_BUDGET_APPROVED' "$workflow"
          grep -q 'PRIVATE_EKS_MONTHLY_BUDGET_USD' "$workflow"
          grep -q 'PRIVATE_EKS_RUNNER_READY' "$workflow"
          grep -q 'PRIVATE_EKS_ENDPOINT_POLICY_READY' "$workflow"
          grep -q 'PRIVATE_EKS_BACKEND_READY' "$workflow"
          grep -q 'PRIVATE_EKS_BOOTSTRAP_ROLE_READY' "$workflow"
          grep -q 'I_UNDERSTAND_PRIVATE_EKS_APPLY' "$workflow"
          grep -q 'I_UNDERSTAND_PRIVATE_EKS_STOP' "$workflow"
          grep -q 'terraform apply -input=false -auto-approve -no-color' "$workflow"
          grep -q 'aws eks describe-cluster' "$workflow"
          grep -q 'endpointPrivateAccess' "$workflow"
          grep -q 'MapPublicIpOnLaunch == false' "$workflow"
          grep -q 'approved_endpoint_set_verified' "$workflow"
          grep -q 'raw_identifiers_published' "$workflow"
          ! grep -q 'terraform destroy' "$workflow"
          ! grep -q 'eks-sandbox/terraform.tfstate' "$workflow"
          ! grep -q 'gpu_instance_type' "$workflow"
