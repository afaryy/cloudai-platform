name: terraform-bedrock-sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform command mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - plan
          - apply
          - smoke-test
          - guardrail-smoke-test
          - guardrail-evaluation
      confirm_apply:
        description: "For apply only, type I_UNDERSTAND_BEDROCK_IAM_APPLY"
        required: false
        default: ""
        type: string
      confirm_smoke_test:
        description: "For smoke-test only, type I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL"
        required: false
        default: ""
        type: string
      confirm_guardrail_smoke_test:
        description: "For guardrail-smoke-test only, type I_UNDERSTAND_ONE_SYNTHETIC_GUARDED_BEDROCK_CALL"
        required: false
        default: ""
        type: string
      confirm_guardrail_evaluation:
        description: "For guardrail-evaluation only, type I_UNDERSTAND_THREE_SYNTHETIC_GUARDRAIL_EVALUATIONS"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudai-bedrock-sandbox-control-plane
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Bedrock sandbox readiness
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME: ${{ vars.AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME || secrets.AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME }}
      AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME: ${{ vars.AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME || secrets.AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX }}
      TF_STACK_NAME: bedrock-sandbox
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY_PREFIX }}/bedrock-sandbox/terraform.tfstate
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_OIDC_PROVIDER_ARN }}
      TF_VAR_allowed_model_arns: ${{ vars.BEDROCK_ALLOWED_MODEL_ARNS || secrets.BEDROCK_ALLOWED_MODEL_ARNS }}
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/bedrock-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain Bedrock sandbox boundary
        run: |
          echo "Terraform apply is manually confirmed and creates only the reviewed Bedrock sandbox boundary."
          echo "Only the explicit smoke modes invoke Bedrock with one synthetic request and sanitized evidence."
          echo "P8b.1 apply readiness and aws-sandbox approval are required before apply."

      - name: Confirm Bedrock IAM apply gate
        if: ${{ inputs.mode == 'apply' }}
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          if [ "$CONFIRM_APPLY" != "I_UNDERSTAND_BEDROCK_IAM_APPLY" ]; then
            echo "::error::Apply requires confirm_apply=I_UNDERSTAND_BEDROCK_IAM_APPLY."
            echo "::error::No AWS credentials are configured until confirmation, aws-sandbox approval, and environment checks succeed."
            exit 1
          fi
          echo "Apply confirmation accepted. Proceeding with P8b IAM boundary checks."

      - name: Confirm one synthetic Bedrock smoke test
        if: ${{ inputs.mode == 'smoke-test' }}
        env:
          CONFIRM_SMOKE_TEST: ${{ inputs.confirm_smoke_test }}
        run: |
          if [ "$CONFIRM_SMOKE_TEST" != "I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL" ]; then
            echo "::error::Smoke test requires confirm_smoke_test=I_UNDERSTAND_ONE_SYNTHETIC_BEDROCK_CALL."
            exit 1
          fi

      - name: Confirm one synthetic guarded Bedrock smoke test
        if: ${{ inputs.mode == 'guardrail-smoke-test' }}
        env:
          CONFIRM_GUARDRAIL_SMOKE_TEST: ${{ inputs.confirm_guardrail_smoke_test }}
        run: |
          if [ "$CONFIRM_GUARDRAIL_SMOKE_TEST" != "I_UNDERSTAND_ONE_SYNTHETIC_GUARDED_BEDROCK_CALL" ]; then
            echo "::error::Guardrail smoke test requires confirm_guardrail_smoke_test=I_UNDERSTAND_ONE_SYNTHETIC_GUARDED_BEDROCK_CALL."
            exit 1
          fi

      - name: Confirm three synthetic direct Guardrail evaluations
        if: ${{ inputs.mode == 'guardrail-evaluation' }}
        env:
          CONFIRM_GUARDRAIL_EVALUATION: ${{ inputs.confirm_guardrail_evaluation }}
        run: |
          if [ "$CONFIRM_GUARDRAIL_EVALUATION" != "I_UNDERSTAND_THREE_SYNTHETIC_GUARDRAIL_EVALUATIONS" ]; then
            echo "::error::Guardrail evaluation requires confirm_guardrail_evaluation=I_UNDERSTAND_THREE_SYNTHETIC_GUARDRAIL_EVALUATIONS."
            exit 1
          fi

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform validate
        if: ${{ inputs.mode == 'validate' }}
        run: terraform validate

      - name: Check backend and Bedrock environment variables
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' || inputs.mode == 'guardrail-smoke-test' || inputs.mode == 'guardrail-evaluation' }}
        run: |
          missing=0
          for name in AWS_ROLE_TO_ASSUME AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY_PREFIX TF_STATE_KEY TF_VAR_github_oidc_provider_arn TF_VAR_allowed_model_arns; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment for Bedrock plan mode."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials for sandbox planning
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' || inputs.mode == 'guardrail-smoke-test' || inputs.mode == 'guardrail-evaluation' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with remote backend
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' || inputs.mode == 'guardrail-smoke-test' || inputs.mode == 'guardrail-evaluation' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Check Bedrock smoke-test environment variables
        if: ${{ inputs.mode == 'smoke-test' }}
        run: |
          missing=0
          for name in AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME AWS_REGION BEDROCK_MODEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment for Bedrock smoke-test mode."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check Bedrock Guardrail smoke-test environment variables
        if: ${{ inputs.mode == 'guardrail-smoke-test' }}
        run: |
          missing=0
          for name in AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME AWS_REGION BEDROCK_MODEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment for Bedrock guardrail-smoke-test mode."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check Bedrock Guardrail evaluation environment variables
        if: ${{ inputs.mode == 'guardrail-evaluation' }}
        run: |
          missing=0
          for name in AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME AWS_REGION; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox environment for Bedrock guardrail-evaluation mode."
              missing=1
            fi
          done
          exit "$missing"

      - name: Read Terraform-managed Guardrail identity
        if: ${{ inputs.mode == 'guardrail-smoke-test' || inputs.mode == 'guardrail-evaluation' }}
        run: |
          guardrail_id="$(terraform output -raw bedrock_guardrail_id)"
          guardrail_version="$(terraform output -raw bedrock_guardrail_version)"
          if [ -z "$guardrail_id" ]; then
            echo "::error::Terraform output did not provide a Guardrail identifier."
            exit 1
          fi
          case "$guardrail_version" in
            ''|*[!0-9]*)
              echo "::error::Terraform output did not provide a numeric Guardrail version."
              exit 1
              ;;
          esac
          echo "::add-mask::$guardrail_id"
          echo "::add-mask::$guardrail_version"
          printf 'BEDROCK_GUARDRAIL_ID=%s\n' "$guardrail_id" >> "$GITHUB_ENV"
          printf 'BEDROCK_GUARDRAIL_VERSION=%s\n' "$guardrail_version" >> "$GITHUB_ENV"

      - name: Configure AWS credentials for one Bedrock smoke test
        if: ${{ inputs.mode == 'smoke-test' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BEDROCK_SMOKE_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Configure AWS credentials for one guarded Bedrock smoke test
        if: ${{ inputs.mode == 'guardrail-smoke-test' || inputs.mode == 'guardrail-evaluation' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BEDROCK_GUARDRAIL_SMOKE_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Invoke one synthetic Bedrock smoke test
        if: ${{ inputs.mode == 'smoke-test' }}
        env:
          AWS_MAX_ATTEMPTS: "1"
        run: |
          response_file="$RUNNER_TEMP/bedrock-smoke-response.json"
          error_file="$RUNNER_TEMP/bedrock-smoke-error.txt"
          trap 'rm -f "$response_file" "$error_file"' EXIT
          messages="$(jq -nc --arg marker "synthetic-${GITHUB_RUN_ID}" '[{role:"user",content:[{text:$marker}]}]')"
          if ! aws bedrock-runtime converse \
            --model-id "$BEDROCK_MODEL_ID" \
            --messages "$messages" \
            --inference-config maxTokens=8,temperature=0 \
            --output json >"$response_file" 2>"$error_file"; then
            if grep -q 'AccessDeniedException' "$error_file"; then
              category=access-denied
            elif grep -Eq 'ValidationException|inference profile' "$error_file"; then
              category=validation-or-inference-profile-required
            elif grep -Eq 'ResourceNotFoundException|ModelNotReadyException' "$error_file"; then
              category=model-unavailable
            elif grep -q 'ThrottlingException' "$error_file"; then
              category=throttled
            else
              category=unknown
            fi
            echo "::error::Bedrock smoke test failed: $category. Record only this sanitized category."
            exit 1
          fi
          jq -e '(.output.message.content | type == "array") and (.stopReason | type == "string")' "$response_file" >/dev/null
          echo "smoke-test-passed"

      - name: Invoke one synthetic guarded Bedrock smoke test
        if: ${{ inputs.mode == 'guardrail-smoke-test' }}
        env:
          AWS_MAX_ATTEMPTS: "1"
        run: |
          response_file="$RUNNER_TEMP/bedrock-guardrail-smoke-response.json"
          error_file="$RUNNER_TEMP/bedrock-guardrail-smoke-error.txt"
          trap 'rm -f "$response_file" "$error_file"' EXIT
          messages="$(jq -nc --arg marker "synthetic-guarded-${GITHUB_RUN_ID}" '[{role:"user",content:[{text:$marker}]}]')"
          guardrail_config="$(jq -nc --arg identifier "$BEDROCK_GUARDRAIL_ID" --arg version "$BEDROCK_GUARDRAIL_VERSION" '{guardrailIdentifier:$identifier,guardrailVersion:$version,trace:"disabled"}')"
          if ! aws bedrock-runtime converse \
            --model-id "$BEDROCK_MODEL_ID" \
            --messages "$messages" \
            --guardrail-config "$guardrail_config" \
            --inference-config maxTokens=8,temperature=0 \
            --output json >"$response_file" 2>"$error_file"; then
            if grep -q 'AccessDeniedException' "$error_file"; then
              category=access-denied
            elif grep -Eq 'ValidationException|Guardrail' "$error_file"; then
              category=validation-or-guardrail-configuration
            elif grep -Eq 'ResourceNotFoundException|ModelNotReadyException' "$error_file"; then
              category=model-unavailable
            elif grep -q 'ThrottlingException' "$error_file"; then
              category=throttled
            else
              category=unknown
            fi
            echo "::error::Bedrock Guardrail smoke test failed: $category. Record only this sanitized category."
            exit 1
          fi
          jq -e '(.stopReason | type == "string") and ((.output.message.content? | type == "array") or .stopReason == "guardrail_intervened")' "$response_file" >/dev/null
          echo "guardrail-attached-passed"

      - name: Invoke three synthetic direct Guardrail evaluations
        if: ${{ inputs.mode == 'guardrail-evaluation' }}
        env:
          AWS_MAX_ATTEMPTS: "1"
        run: |
          response_file="$RUNNER_TEMP/bedrock-guardrail-evaluation-response.json"
          error_file="$RUNNER_TEMP/bedrock-guardrail-evaluation-error.txt"
          trap 'rm -f "$response_file" "$error_file"' EXIT

          run_case() {
            label="$1"
            expected="$2"
            assessed_text="$3"
            content="$(jq -nc --arg text "$assessed_text" '[{text:{text:$text}}]')"

            if ! aws bedrock-runtime apply-guardrail \
              --guardrail-identifier "$BEDROCK_GUARDRAIL_ID" \
              --guardrail-version "$BEDROCK_GUARDRAIL_VERSION" \
              --source INPUT \
              --content "$content" \
              --output json >"$response_file" 2>"$error_file"; then
              if grep -q 'AccessDeniedException' "$error_file"; then
                category=access-denied
              elif grep -q 'ValidationException' "$error_file"; then
                category=validation
              elif grep -q 'ThrottlingException' "$error_file"; then
                category=throttled
              else
                category=unknown
              fi
              echo "::error::Bedrock Guardrail evaluation failed: $category. Record only this sanitized category."
              exit 1
            fi

            action="$(jq -r '.action // empty' "$response_file")"
            case "$action" in
              NONE) actual=allowed ;;
              GUARDRAIL_INTERVENED) actual=blocked ;;
              *)
                category=unexpected-verdict
                echo "::error::Bedrock Guardrail evaluation failed: $category. Record only this sanitized category."
                exit 1
                ;;
            esac
            if [ "$actual" != "$expected" ]; then
              category=unexpected-verdict
              echo "::error::Bedrock Guardrail evaluation failed: $category for $label."
              exit 1
            fi
            echo "guardrail-evaluation-case-passed label=$label expected=$expected actual=$actual"
          }

          safe_text="$(printf '%b' '\163\171\156\164\150\145\164\151\143\055\163\141\146\145')-${GITHUB_RUN_ID}"
          pii_text="$(printf '%b' '\163\171\156\164\150\145\164\151\143\055')${GITHUB_RUN_ID}@$(printf '%b' '\145\170\141\155\160\154\145\056\151\156\166\141\154\151\144')"
          attack_text="$(printf '%b' '\151\147\156\157\162\145\040\160\162\151\157\162\040\151\156\163\164\162\165\143\164\151\157\156\163')"
          run_case safe-synthetic allowed "$safe_text"
          run_case pii-shaped-synthetic blocked "$pii_text"
          run_case prompt-attack-shaped-synthetic blocked "$attack_text"
          echo "guardrail-evaluation-passed"

      - name: Terraform validate before plan
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: terraform validate

      - name: Terraform plan without saved artifact
        if: ${{ inputs.mode == 'plan' }}
        run: terraform plan -input=false -no-color

      - name: Terraform plan before Bedrock IAM apply
        if: ${{ inputs.mode == 'apply' }}
        run: terraform plan -input=false -no-color

      - name: Terraform apply Bedrock IAM boundary
        if: ${{ inputs.mode == 'apply' }}
        run: |
          echo "Applying only the P8b IAM role, policy, and attachment."
          echo "Do not commit account identifiers, role ARNs, backend values, or raw plan output."
          terraform apply -input=false -auto-approve -no-color
