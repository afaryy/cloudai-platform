name: terraform-cost-guardrails

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform command mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - plan
          - apply
      confirm_apply:
        description: "For apply only, type I_UNDERSTAND_COST_GUARDRAILS_APPLY"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-cost-guardrails
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform cost guardrails
    runs-on: ubuntu-latest
    environment: aws-sandbox
    env:
      AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME: ${{ vars.AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME }}
      AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_LOCK_TABLE: ${{ vars.TF_BACKEND_LOCK_TABLE }}
      TF_STATE_KEY: cost-guardrails/terraform.tfstate
      TF_VAR_budget_alert_email: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
    defaults:
      run:
        working-directory: providers/aws/infra/terraform/envs/cost-guardrails
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Explain cost guardrails boundary
        run: |
          echo "This workflow manages only the reviewed AWS Budgets notification guardrails."
          echo "It creates no GPU, EKS, Budget Action, automatic shutdown, or deletion path."

      - name: Confirm Cost Guardrails apply gate
        if: ${{ inputs.mode == 'apply' }}
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          if [ "$CONFIRM_APPLY" != "I_UNDERSTAND_COST_GUARDRAILS_APPLY" ]; then
            echo "::error::Apply requires confirm_apply=I_UNDERSTAND_COST_GUARDRAILS_APPLY."
            echo "::error::No AWS credentials are configured until confirmation and environment checks succeed."
            exit 1
          fi
          echo "Cost Guardrails apply confirmation accepted."

      - name: Terraform init without backend for validation
        if: ${{ inputs.mode == 'validate' }}
        run: terraform init -backend=false

      - name: Terraform validate
        if: ${{ inputs.mode == 'validate' }}
        run: terraform validate

      - name: Check protected Cost Guardrails environment values
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: |
          missing=0
          for name in AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME AWS_BUDGET_ALERT_EMAIL AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_LOCK_TABLE TF_STATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required in the aws-sandbox Environment for Cost Guardrails ${INPUT_MODE} mode."
              missing=1
            fi
          done
          exit "$missing"
        env:
          INPUT_MODE: ${{ inputs.mode }}

      - name: Configure AWS credentials for Cost Guardrails
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init with remote backend
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform plan before Cost Guardrails apply
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: terraform plan -input=false -no-color

      - name: Terraform apply Cost Guardrails
        if: ${{ inputs.mode == 'apply' }}
        run: terraform apply -input=false -auto-approve -no-color

      - name: Report sanitized completion
        if: ${{ inputs.mode == 'apply' && success() }}
        run: echo "Cost Guardrails apply completed. Review AWS Budgets and protected workflow evidence for notification delivery."
