replicaCount: 2

image:
  repository: ghcr.io/afaryy/cloudai-platform/mock-ai-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

platformLabels:
  owner: platform-engineering
  environment: sandbox
  dataScope: synthetic-only
  costCenter: portfolio
  platformCapability: cloud-ai-platform

config:
  nodeEnv: production
  mockMode: "true"
  logLevel: info
  dataScope: synthetic-only
  providerMode: mock
  allowedModel: mock-bedrock-claude

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
