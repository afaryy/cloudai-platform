AWSTemplateFormatVersion: "2010-09-09"
Description: Public-safe bootstrap example for cloudai-platform Terraform backend and GitHub Actions OIDC role.

Parameters:
  BackendBucketName:
    Type: String
    Description: Private S3 bucket name for Terraform state. Use a globally unique value and do not commit real names elsewhere.
    MinLength: 3
  LockTableName:
    Type: String
    Description: DynamoDB table name for Terraform state locking.
    Default: cloudai-platform-terraform-locks
  GitHubOrg:
    Type: String
    Default: afaryy
  GitHubRepo:
    Type: String
    Default: cloudai-platform
  GitHubEnvironment:
    Type: String
    Default: aws-sandbox
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: Existing account-level GitHub OIDC provider ARN. Example arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BackendBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${TerraformStateBucket.Arn}"
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LockTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  GitHubActionsTerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-${GitHubEnvironment}-terraform"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: TerraformBackendAndEksSandboxPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformBackendAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}"
                  - !Sub "${TerraformStateBucket.Arn}/*"
              - Sid: TerraformLockAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt TerraformLockTable.Arn
              - Sid: EksSandboxReadAccess
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - eks:Describe*
                  - eks:List*
                  - iam:Get*
                  - iam:List*
                  - cloudwatch:Describe*
                  - logs:Describe*
                  - kms:Describe*
                  - kms:List*
                  - autoscaling:Describe*
                Resource: "*"
              - Sid: EksSandboxNetworkApply
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                Resource: "*"
              - Sid: EksSandboxIamApply
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-eks-sandbox-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-sandbox-*"
              - Sid: EksSandboxPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-eks-sandbox-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-sandbox-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - eks.amazonaws.com
                      - ec2.amazonaws.com
              - Sid: EksSandboxManagedPolicyRead
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
              - Sid: EksSandboxClusterApply
                Effect: Allow
                Action:
                  - eks:CreateCluster
                  - eks:CreateNodegroup
                  - eks:DeleteCluster
                  - eks:DeleteNodegroup
                  - eks:TagResource
                  - eks:UntagResource
                  - eks:UpdateClusterConfig
                  - eks:UpdateNodegroupConfig
                  - eks:UpdateNodegroupVersion
                Resource: "*"

Outputs:
  BackendBucketName:
    Description: S3 bucket for Terraform state.
    Value: !Ref TerraformStateBucket
  LockTableName:
    Description: DynamoDB table for Terraform state locking.
    Value: !Ref TerraformLockTable
  GitHubActionsRoleArn:
    Description: Store privately as AWS_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsTerraformRole.Arn
