AWSTemplateFormatVersion: "2010-09-09"
Description: Public-safe bootstrap example for cloudai-platform Terraform backend and GitHub Actions OIDC role.

Parameters:
  BackendBucketName:
    Type: String
    Description: Private S3 bucket name for Terraform state. Use a globally unique value and do not commit real names elsewhere.
    MinLength: 3
  LockTableName:
    Type: String
    Description: DynamoDB table name for Terraform state locking.
    Default: cloudai-platform-terraform-locks
  GitHubOrg:
    Type: String
    Default: afaryy
  GitHubRepo:
    Type: String
    Default: cloudai-platform
  GitHubEnvironment:
    Type: String
    Default: aws-sandbox
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: Existing account-level GitHub OIDC provider ARN. Example arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BackendBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${TerraformStateBucket.Arn}"
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LockTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  GitHubActionsTerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-${GitHubEnvironment}-terraform"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: TerraformBackendAndEksSandboxPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformBackendAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}"
                  - !Sub "${TerraformStateBucket.Arn}/*"
              - Sid: TerraformLockAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt TerraformLockTable.Arn
              - Sid: EksSandboxPlanningAndApplyPlaceholder
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - eks:Describe*
                  - eks:List*
                  - iam:Get*
                  - iam:List*
                  - cloudwatch:Describe*
                  - logs:Describe*
                  - kms:Describe*
                  - kms:List*
                  - autoscaling:Describe*
                Resource: "*"

Outputs:
  BackendBucketName:
    Description: S3 bucket for Terraform state.
    Value: !Ref TerraformStateBucket
  LockTableName:
    Description: DynamoDB table for Terraform state locking.
    Value: !Ref TerraformLockTable
  GitHubActionsRoleArn:
    Description: Store privately as AWS_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsTerraformRole.Arn
