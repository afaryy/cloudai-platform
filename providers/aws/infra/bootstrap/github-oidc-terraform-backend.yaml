AWSTemplateFormatVersion: "2010-09-09"
Description: Public-safe bootstrap example for cloudai-platform Terraform backend and GitHub Actions OIDC role.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  BackendBucketName:
    Type: String
    Description: Private S3 bucket name for Terraform state. Use a globally unique value and do not commit real names elsewhere.
    MinLength: 3
  LockTableName:
    Type: String
    Description: DynamoDB table name for Terraform state locking.
    Default: cloudai-platform-terraform-locks
  GitHubOrg:
    Type: String
    Default: afaryy
  GitHubRepo:
    Type: String
    Default: cloudai-platform
  GitHubEnvironment:
    Type: String
    Default: aws-sandbox
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: Existing account-level GitHub OIDC provider ARN. Example arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com
  BootstrapRoleName:
    Type: String
    Default: cloudai-platform-aws-sandbox-bootstrap
    Description: Dedicated GitHub OIDC role used only to update this CloudFormation bootstrap stack.
  BudgetGuardrailsStateKey:
    Type: String
    Default: cost-guardrails/terraform.tfstate
    Description: Exact private Terraform state key permitted to the dedicated Budget Guardrails role.
  PrivateEKSNetworkStateKey:
    Type: String
    Default: cloudai-platform/eks-private-network/terraform.tfstate
    Description: Exact private Terraform state key permitted to the dedicated private-network role.
  PrivateEKSRunnerStateKey:
    Type: String
    Default: cloudai-platform/eks-private-runner/terraform.tfstate
    Description: Exact private Terraform state key permitted to the dedicated runner-state role.
  AgentCoreRagNamePrefix:
    Type: String
    Default: cloudaiplatformagentcoreragsandbox
    Description: Name prefix used to scope the AgentCore RAG sandbox observability resources.

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BackendBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${TerraformStateBucket.Arn}"
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LockTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  GitHubActionsTerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-${GitHubEnvironment}-terraform"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        - !Ref AgentCoreRagFunctionalPolicy
        - !Ref AgentCoreRagTerraformPolicy
        - !Ref AgentCoreRagDataPolicy
      Policies:
        - PolicyName: TerraformBackendAndEksSandboxPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformBackendAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}"
                  - !Sub "${TerraformStateBucket.Arn}/*"
              - Sid: TerraformLockAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LockTableName}"
              - Sid: EksSandboxReadAccess
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - eks:Describe*
                  - eks:List*
                  - servicequotas:ListServiceQuotas
                  - iam:Get*
                  - iam:List*
                  - cloudwatch:Describe*
                  - logs:Describe*
                  - kms:Describe*
                  - kms:List*
                  - autoscaling:Describe*
                Resource: "*"
              - Sid: EksSandboxNetworkApply
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                Resource: "*"
              - Sid: EksSandboxIamApply
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-eks-sandbox-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-sandbox-*"
              - Sid: BedrockSandboxIamApply
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:CreateRole
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:ListAttachedRolePolicies
                  - iam:ListPolicyTags
                  - iam:ListRoleTags
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:TagRole
                  - iam:UntagPolicy
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-bedrock-sandbox-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/cloudai-platform-bedrock-sandbox-*"
              - Sid: BedrockSandboxCreateGuardrail
                Effect: Allow
                Action:
                  - bedrock:CreateGuardrail
                Resource: "*"
              - Sid: BedrockSandboxGuardrailLifecycle
                Effect: Allow
                Action:
                  - bedrock:CreateGuardrailVersion
                  - bedrock:DeleteGuardrail
                  - bedrock:GetGuardrail
                  - bedrock:ListTagsForResource
                  - bedrock:TagResource
                  - bedrock:UntagResource
                  - bedrock:UpdateGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
              - Sid: EksSandboxPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-eks-sandbox-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-sandbox-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - eks.amazonaws.com
                      - ec2.amazonaws.com
              - Sid: EksSandboxServiceLinkedRole
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks.amazonaws.com/AWSServiceRoleForAmazonEKS"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks-nodegroup.amazonaws.com/AWSServiceRoleForAmazonEKSNodegroup"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - eks.amazonaws.com
                      - eks-nodegroup.amazonaws.com
              - Sid: EksSandboxManagedPolicyRead
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
              - Sid: EksSandboxClusterApply
                Effect: Allow
                Action:
                  - eks:AssociateAccessPolicy
                  - eks:CreateCluster
                  - eks:CreateAccessEntry
                  - eks:CreateNodegroup
                  - eks:DeleteAccessEntry
                  - eks:DeleteCluster
                  - eks:DeleteNodegroup
                  - eks:DescribeAccessEntry
                  - eks:DisassociateAccessPolicy
                  - eks:ListAccessEntries
                  - eks:ListAssociatedAccessPolicies
                  - eks:TagResource
                  - eks:UntagResource
                  - eks:UpdateClusterConfig
                  - eks:UpdateNodegroupConfig
                  - eks:UpdateNodegroupVersion
                Resource: "*"
  GitHubActionsPrivateEKSNetworkRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      RoleName: !Sub "${GitHubRepo}-aws-private-eks-terraform"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:aws-private-eks"
      Policies:
        - PolicyName: PrivateEKSNetworkTerraformPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformBackendAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}/${PrivateEKSNetworkStateKey}"
                  - !Sub "${TerraformStateBucket.Arn}/${PrivateEKSNetworkStateKey}.tflock"
              - Sid: TerraformStateKeyListing
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "${TerraformStateBucket.Arn}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref PrivateEKSNetworkStateKey
                      - !Sub "${PrivateEKSNetworkStateKey}.tflock"
              - Sid: TerraformLockAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LockTableName}"
              - Sid: PrivateEKSNetworkReadAccess
                Effect: Allow
                Action:
                  - ec2:Describe*
                Resource: "*"
              - Sid: PrivateEKSNetworkLifecycle
                Effect: Allow
                Action:
                  - ec2:AllocateAddress
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateInternetGateway
                  - ec2:CreateNatGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:CreateVpcEndpoint
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteNatGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DeleteVpcEndpoints
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifyVpcEndpoint
                  - ec2:ReleaseAddress
                  - ec2:ReplaceRoute
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"
      Tags:
        - Key: Project
          Value: cloudai-platform
        - Key: Environment
          Value: aws-private-eks
        - Key: ManagedBy
          Value: cloudformation

  GitHubActionsPrivateEKSRunnerRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      RoleName: !Sub "${GitHubRepo}-aws-private-eks-runner-terraform"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:aws-private-eks"
      Policies:
        - PolicyName: PrivateEKSRunnerTerraformPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PrivateEKSRunnerStateAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}/${PrivateEKSRunnerStateKey}"
                  - !Sub "${TerraformStateBucket.Arn}/${PrivateEKSRunnerStateKey}.tflock"
              - Sid: PrivateEKSNetworkStateReadOnly
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}/${PrivateEKSNetworkStateKey}"
              - Sid: PrivateEKSRunnerStateKeyListing
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "${TerraformStateBucket.Arn}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref PrivateEKSRunnerStateKey
                      - !Sub "${PrivateEKSRunnerStateKey}.tflock"
                      - !Ref PrivateEKSNetworkStateKey
                      - !Sub "${PrivateEKSNetworkStateKey}.tflock"
              - Sid: PrivateEKSRunnerLockAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LockTableName}"
              - Sid: ManageOnlyPrivateEKSRunnerCodeBuildProject
                Effect: Allow
                Action:
                  - codebuild:BatchGetProjects
                  - codebuild:CreateProject
                  - codebuild:CreateWebhook
                  - codebuild:UpdateProjectVisibility
                Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/cloudai-platform-private-eks-runner"
              - Sid: DiscoverCodeBuildSourceCredentials
                Effect: Allow
                Action:
                  - codebuild:ListSourceCredentials
                Resource: "*"
              - Sid: ManageOnlyPrivateEKSRunnerServiceRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-private-runner-private-runner"
              - Sid: ManageOnlyPrivateEKSRunnerServicePolicy
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyTags
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/cloudai-platform-eks-private-runner-private-runner"
              - Sid: PassOnlyPrivateEKSRunnerServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudai-platform-eks-private-runner-private-runner"
                Condition:
                  StringEquals:
                    iam:PassedToService: codebuild.amazonaws.com
              - Sid: ManageOnlyPrivateEKSRunnerLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagLogGroup
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/cloudai-platform-private-eks-runner*"
              - Sid: DescribeRunnerLogGroups
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - Key: Project
          Value: cloudai-platform
        - Key: Environment
          Value: aws-private-eks
        - Key: ManagedBy
          Value: cloudformation

  AgentCoreRagTerraformPolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      ManagedPolicyName: !Sub "${GitHubRepo}-agentcore-rag-terraform"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AgentCoreRuntimeIdentityServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/runtime-identity.bedrock-agentcore.amazonaws.com/AWSServiceRoleForBedrockAgentCoreRuntimeIdentity"
            Condition:
              StringEquals:
                iam:AWSServiceName: runtime-identity.bedrock-agentcore.amazonaws.com
          - Sid: CreateTaggedAgentCoreEcrRepository
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Project: cloudai-platform
                aws:RequestTag/Environment: agentcore-rag-sandbox
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Project
                  - Environment
                  - DataScope
                  - ManagedBy
                  - CostBoundary
                  - TeardownRequired
                  - CloudAISlice
              "Null":
                aws:TagKeys: "false"
          - Sid: ManageOnlyTheAgentCoreEcrRepository
            Effect: Allow
            Action:
              - ecr:DeleteLifecyclePolicy
              - ecr:DeleteRepository
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:GetLifecyclePolicy
              - ecr:ListTagsForResource
              - ecr:PutLifecyclePolicy
              - ecr:TagResource
              - ecr:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/cloudai-platform-agentcore-rag-sandbox"
          - Sid: CreateOnlyNamedAgentCoreRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:TagRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudaiplatformagentcoreragsandbox-*"
            Condition:
              StringEquals:
                aws:RequestTag/Project: cloudai-platform
                aws:RequestTag/Environment: agentcore-rag-sandbox
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Project
                  - Environment
                  - DataScope
                  - ManagedBy
                  - CostBoundary
                  - TeardownRequired
                  - CloudAISlice
              "Null":
                aws:TagKeys: "false"
          - Sid: ManageOnlyNamedAgentCoreRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudaiplatformagentcoreragsandbox-*"
          - Sid: PassOnlySandboxRolesToAgentCore
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudaiplatformagentcoreragsandbox-*"
            Condition:
              StringEquals:
                iam:PassedToService: bedrock-agentcore.amazonaws.com
          - Sid: CreateOnlyTaggedAgentCoreResources
            Effect: Allow
            Action:
              - bedrock-agentcore:CreateAgentRuntime
              - bedrock-agentcore:CreateGateway
              - bedrock-agentcore:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Project: cloudai-platform
                aws:RequestTag/Environment: agentcore-rag-sandbox
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Project
                  - Environment
                  - DataScope
                  - ManagedBy
                  - CostBoundary
                  - TeardownRequired
                  - CloudAISlice
              "Null":
                aws:TagKeys: "false"
          - Sid: AgentCoreRuntimeProvisioningDependencies
            Effect: Allow
            Action:
              - bedrock-agentcore:CreateAgentRuntimeEndpoint
              - bedrock-agentcore:DeleteAgentRuntimeEndpoint
              - bedrock-agentcore:DeleteWorkloadIdentity
              - bedrock-agentcore:PassCapacityProvider
            Resource: "*"
          - Sid: AgentCoreCreateRuntimeWorkloadIdentity
            Effect: Allow
            Action:
              - bedrock-agentcore:CreateWorkloadIdentity
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"
          - Sid: ManageOnlyTaggedAgentCoreResources
            Effect: Allow
            Action:
              - bedrock-agentcore:DeleteAgentRuntime
              - bedrock-agentcore:DeleteGateway
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:ListTagsForResource
              - bedrock-agentcore:TagResource
              - bedrock-agentcore:UntagResource
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:UpdateGateway
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
              - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: ManageTargetsOnlyForTaggedGateway
            Effect: Allow
            Action:
              - bedrock-agentcore:CreateGatewayTarget
              - bedrock-agentcore:DeleteGatewayTarget
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:SynchronizeGatewayTargets
              - bedrock-agentcore:UpdateGatewayTarget
            Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: ListAgentCoreForTerraformStateRefresh
            Effect: Allow
            Action:
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:ListGateways
            Resource: "*"

  AgentCoreRagDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      ManagedPolicyName: !Sub "${GitHubRepo}-agentcore-rag-data"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageAgentCoreRagDataStack
            Effect: Allow
            Action:
              - cloudformation:CreateStack
            Resource: "*"
          - Sid: ManageOnlyAgentCoreRagDataStack
            Effect: Allow
            Action:
              - cloudformation:DeleteStack
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:GetTemplate
              - cloudformation:ListStackResources
              - cloudformation:TagResource
              - cloudformation:UntagResource
              - cloudformation:UpdateStack
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GitHubRepo}-agentcore-rag-data/*"
          - Sid: PassOnlyAgentCoreRagDataRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudaiplatformagentcoreragsandbox-knowledge-base-stack"
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: ManageOnlyAgentCoreRagSourceDocuments
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::${GitHubRepo}-agentcore-rag-source-*"
          - Sid: WriteOnlyAgentCoreRagSourceDocuments
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectTagging
              - s3:GetObject
              - s3:GetObjectTagging
              - s3:PutObject
              - s3:PutObjectTagging
            Resource: !Sub "arn:${AWS::Partition}:s3:::${GitHubRepo}-agentcore-rag-source-*/*"
          - Sid: ManageOnlyAgentCoreRagObservabilityDashboard
            Effect: Allow
            Action:
              - cloudwatch:DeleteDashboards
              - cloudwatch:GetDashboard
              - cloudwatch:PutDashboard
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${AgentCoreRagNamePrefix}-observability"
          - Sid: ManageOnlyAgentCoreRagObservabilityAlarms
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListTagsForResource
              - cloudwatch:PutMetricAlarm
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AgentCoreRagNamePrefix}-retrieval-unavailable"
              - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AgentCoreRagNamePrefix}-answer-latency"

  AgentCoreRagFunctionalPolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      ManagedPolicyName: !Sub "${GitHubRepo}-agentcore-rag-functional"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeOnlyTaggedAgentCoreGateway
            Effect: Allow
            Action:
              - bedrock-agentcore:InvokeGateway
            Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: ManageOnlyTaggedAgentCoreKnowledgeBaseIngestion
            Effect: Allow
            Action:
              - bedrock:GetIngestionJob
              - bedrock:StartIngestionJob
            Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: RetrieveOnlyTaggedAgentCoreKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
            Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: GenerateOnlyTaggedAgentCoreKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:RetrieveAndGenerate
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: cloudai-platform
                aws:ResourceTag/Environment: agentcore-rag-sandbox
          - Sid: InvokeOnlyApprovedAgentCoreRagSystemInferenceProfile
            Effect: Allow
            Action:
              - bedrock:GetInferenceProfile
              - bedrock:InvokeModel
            Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/au.anthropic.claude-haiku-4-5-20251001-v1:0"
          - Sid: InvokeOnlyApprovedAgentCoreRagFoundationModel
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
              - !Sub "arn:${AWS::Partition}:bedrock:ap-southeast-4::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"

  GitHubActionsBudgetGuardrailsRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      RoleName: !Sub "${GitHubRepo}-${GitHubEnvironment}-budget-guardrails"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: CostGuardrailsTerraformPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformBackendAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${TerraformStateBucket.Arn}/${BudgetGuardrailsStateKey}"
              - Sid: TerraformLockfileAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${TerraformStateBucket.Arn}/${BudgetGuardrailsStateKey}.tflock"
              - Sid: ListOnlyCostGuardrailsStateKey
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "${TerraformStateBucket.Arn}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref BudgetGuardrailsStateKey
                      - !Sub "${BudgetGuardrailsStateKey}.tflock"
              - Sid: CreateOnlyRequiredTaggedCloudAiBudgets
                Effect: Allow
                Action:
                  - budgets:ModifyBudget
                  - budgets:TagResource
                Resource: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/cloudai-platform-*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: cloudai-platform
                    aws:RequestTag/Environment: cost-guardrails
                    aws:RequestTag/ManagedBy: terraform
                    aws:RequestTag/DataScope: synthetic-only
                    aws:RequestTag/CostBoundary: pre-gpu-poc
                    aws:RequestTag/CloudAISlice: YY-44
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - Project
                      - Environment
                      - ManagedBy
                      - DataScope
                      - CostBoundary
                      - CloudAISlice
                  "Null":
                    aws:TagKeys: "false"
              - Sid: ManageOnlyTaggedCloudAiBudgets
                Effect: Allow
                Action:
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/cloudai-platform-*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: cloudai-platform
                    aws:ResourceTag/Environment: cost-guardrails
              - Sid: RequiredBillingPortalAccessForBudgets
                Effect: Allow
                Action:
                  - aws-portal:ModifyBilling
                  - aws-portal:ViewBilling
                Resource: "*"
      Tags:
        - Key: Project
          Value: cloudai-platform
        - Key: Environment
          Value: cost-guardrails
        - Key: ManagedBy
          Value: cloudformation

  GitHubActionsAgentCoreEvaluationRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubActionsBootstrapRole
    Properties:
      RoleName: !Sub "${GitHubRepo}-${GitHubEnvironment}-agentcore-evaluation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: AgentCoreEvaluationDataPlanePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EvaluateOnlySyntheticProviderParity
                Effect: Allow
                Action:
                  - bedrock-agentcore:Evaluate
                Resource: "*"
      Tags:
        - { Key: Project, Value: cloudai-platform }
        - { Key: Environment, Value: aws-sandbox }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: DataScope, Value: synthetic-only }

  GitHubActionsBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref BootstrapRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: BootstrapStackChangeSetControl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOnlyThisBootstrapStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              - Sid: ManageChangeSetsForThisBootstrapStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/cloudai-bootstrap-*/*"
              - Sid: ManageOnlyTerraformBootstrapAndBudgetRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-${GitHubEnvironment}-terraform"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-${GitHubEnvironment}-budget-guardrails"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-${GitHubEnvironment}-agentcore-evaluation"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-aws-private-eks-terraform"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-aws-private-eks-runner-terraform"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BootstrapRoleName}"
              - Sid: ManageOnlyAgentCoreRagManagedPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListEntitiesForPolicy
                  - iam:ListPolicyTags
                  - iam:ListPolicyVersions
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${GitHubRepo}-agentcore-rag-functional"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${GitHubRepo}-agentcore-rag-terraform"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${GitHubRepo}-agentcore-rag-data"

Outputs:
  BackendBucketName:
    Description: S3 bucket for Terraform state.
    Value: !Ref TerraformStateBucket
  LockTableName:
    Description: DynamoDB table for Terraform state locking.
    Value: !Ref TerraformLockTable
  GitHubActionsRoleArn:
    Description: Store privately as AWS_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsTerraformRole.Arn
  BudgetGuardrailsRoleArn:
    Description: Store as AWS_BUDGET_GUARDRAILS_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsBudgetGuardrailsRole.Arn
  AgentCoreEvaluationRoleArn:
    Description: Store as AWS_AGENTCORE_EVALUATION_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsAgentCoreEvaluationRole.Arn
  BudgetGuardrailsStateKey:
    Description: Fixed state key used only by the dedicated Budget Guardrails Terraform workflow.
    Value: !Ref BudgetGuardrailsStateKey
  PrivateEKSNetworkRoleArn:
    Description: Store privately as AWS_ROLE_TO_ASSUME in the aws-private-eks GitHub environment.
    Value: !GetAtt GitHubActionsPrivateEKSNetworkRole.Arn
  PrivateEKSNetworkStateKey:
    Description: Fixed state key used only by the dedicated private-network Terraform workflow.
    Value: !Ref PrivateEKSNetworkStateKey
  PrivateEKSRunnerRoleArn:
    Description: Store privately as AWS_PRIVATE_EKS_RUNNER_ROLE_TO_ASSUME in the aws-private-eks GitHub environment.
    Value: !GetAtt GitHubActionsPrivateEKSRunnerRole.Arn
  PrivateEKSRunnerStateKey:
    Description: Fixed state key used only by the dedicated runner Terraform workflow.
    Value: !Ref PrivateEKSRunnerStateKey
  BootstrapRoleArn:
    Description: Store privately as AWS_BOOTSTRAP_ROLE_TO_ASSUME in the aws-sandbox GitHub environment.
    Value: !GetAtt GitHubActionsBootstrapRole.Arn
